status_label: "🔼 회복 확인 — 6월 정점 재돌파 (가설 A 우세로 격상)"
one_line_summary: >-
  08월 1~10일 잠정치(+155.4%, 계속 둔화)가 가리켰던 방향이 관세청
  확정치에서 반전됐다: 반도체수출 $46.8B(+206.1% YoY)로 6월 정점
  ($44.8B)을 재돌파(신정점), 총수출도 $98.3B(+68.7%)로 3개월 연속
  $90B+ 유지. 체크리스트 6항목 중 4개(레벨 반등·YoY 재가속·정점
  재돌파·HBM Cycle Score 붕괴조건⑤ 여유 확대)가 회복 신호로 전환,
  가설 A(캘린더·타이밍 노이즈)로 우세 격상. 고정가·CapEx 가이던스
  (항목 4·5)는 이번 발표 범위 밖이라 완전 확정은 아님 — 9월 데이터가
  다음 관찰점.
