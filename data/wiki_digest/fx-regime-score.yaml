one_line_summary: >-
  국면 ⑥ 2개월째(과거 중앙값 11개월의 초입), 36개월선 대비 -4.5%.
  강세 근거는 경상수지(+1.00, 이력 백분위 100%)·수출(+1.00, 총수출 YoY
  +68.7%)·한미 금리차 축소 방향(+0.43). 역풍은 미 10년물(-0.62, 4.80%)로
  ⑤2021 국면을 끝낸 바로 그 요인 — 3개월 +50bp 임계 접근이 다음
  체크포인트. **2026-09-10 뉴스 조사로 지정학 0.55→0.80 상향**(브렌트
  100달러 돌파·사우디 에너지시설 피격을 저장소 FRED 계열이 $96로 지연
  반영 중이었다) → 종료 트리거 '지정학 급등(2011형)' 발화, 원인은
  NON_US_SHOCK이라 장기채 함의가 미국 긴축형과 정반대다. 다만 종료
  트리거의 실측 리프트는 1.19x로 미약해 이 한 건으로 종료를 예단하지 않는다.
  **2026-09-11 추가**: 파월 "인플레 진전 더딜 것"+PPI 쇼크로 US_TIGHTENING
  신호가 섞이기 시작 — 어제의 NON_US_SHOCK 단일 분류가 흔들린다. 두 유형은
  장기채 함의가 정반대라 구분이 중요하다. 브렌트 $109.51(5일 +12.2%)로
  저장소 데이터가 뉴스를 따라잡았다.
