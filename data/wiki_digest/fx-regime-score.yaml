status_label: "🟢 원화 강세 국면 — 종료 트리거 전제 붕괴(브렌트 $99·이란 외교), 원인이 미국 외 충격에서 US_TIGHTENING으로 이동"
one_line_summary: >-
  **종료 트리거 '지정학 급등(2011형)'의 전제가 12일 만에 뒤집혔다.**
  2026-09-10에 지정학을 0.55→0.80으로 올린 근거는 "브렌트 100달러 돌파·사우디
  피격"이었는데, 2026-09-23 실측은 **브렌트 약 $99**(100달러 아래)이고 사우디는
  **오만 경유 대체 수출로**를 확보했으며 트럼프는 UN 총회에서 **이란 특사와
  "매우 좋은" 회담**을 했다 → **NON_US_SHOCK 축은 해소 방향**.
  ⚠️ **핵심은 그런데도 원화가 안 돌아왔다는 것** — 유가가 $130대→$99로
  풀렸는데 **원/달러는 1,384.30원(9/22 ECOS), 5일 +2.90%**다. 공급 충격이
  빠졌는데 원화가 약하면 **남은 압력은 달러 쪽(US_TIGHTENING)**이며, 09-11에
  "섞이기 시작했다"고 본 성분이 이제 **주된 성분**으로 보인다. 실증: 9/16
  FOMC가 25bp 인상(3.75~4.00%, 12-0), 점도표 추가 1회 이상, DXY 100.54(9/22).
  두 유형은 장기채 함의가 정반대라 이 재분류는 FRS 금리차 가중(25%) 해석에
  직접 영향을 준다. 검증 사례: P0022("선반영돼 1,380원 전에 멈춘다")가 실측
  1,384.30으로 빗나감 — 환율 동인을 유가로 본 가정이 틀렸다는 직접 증거.
  ⚠️ 인물 정정: 09-11 항목의 "파월"은 오기이며 현 의장은 **케빈 워시**다
  (append-only라 과거 항목은 두고 정정만 기록). 다음 체크포인트는 기존대로
  **미 10년물 3개월 +50bp 임계**(현재 4.96%, 20일 +0.29%p).
