status_label: "🟡 가격은 패닉 탈출, 외국인 수급 미해소 — ⚠️ 마지막 판정 후 장기 공백"
one_line_summary: >-
  2026-08-24 잠정 판정: 가격만 보면 바닥 다지기를 지나 회복이 상당히 진행
  (8/6 패닉 저점 1,495,000원 → 8/24 1,717,000원, +14.8%). 그 사이 40조원
  자사주 매입·소각 확정(8/19)과 54.3조원 신규 팹 투자 확정(8/7) 같은 굵직한
  호재가 있었다. 다만 이 프레임의 핵심 축인 **외국인 수급이 20일 누적
  -4조 3,112억원 순매도로 미해소**라 "완전한 회복 확정"은 보류됐고,
  Tier1/Tier2 재검증도 18일치가 밀린 채 이월됐다.
  ⚠️ **그 재검증이 아직 안 됐다** — 이 판정은 마지막 갱신 시점 것이고
  브리핑에서 인용할 때 반드시 경과 일수를 함께 표기할 것.
