slug: ai-capex-slowdown
status_label: "🟡 AI 속도조절론 — 수요는 강하고 CapEx도 유지, 새 압력은 '무엇으로 돈을 대나'(FCF 마이너스·부채 이자)"
as_of: "2026-10-30"
one_line_summary: >
  빅테크 3Q 실적(10/28~10/29)에서 **CapEx 하향은 한 곳도 없다** — 알파벳
  연간 $195~205B 유지·2027년 $300B+ 예고, MS는 운용리스 분류로 숫자만
  낮아짐, 아마존 2026년 **약 $220B 유지**(2027 컨센서스 $280B+). 수요도
  강하다: **AWS +39%**(약 5년 만의 최고), 영업이익률 13.9% 사상 최고.
  대신 공통 압력이 생겼다 — **잉여현금흐름 마이너스**(알파벳 분기 −$9.1B,
  아마존 12개월 +$14.8B→**−$42.4B**)를 부채로 메우며 **이자 비용이 EPS를
  깎기 시작**(아마존 EPS $1.89 vs 예상 $1.96, 시간외 −6.5~11%). 코어위브(10/25)가
  먼저 겪은 재무 압박 경로가 1등급 빅테크로 올라왔다. 메모리 함의: 단기
  수요 신호는 +, 꺾임 경로는 "수요 소멸"이 아니라 "**조달이 막혀 2027년
  증액분이 깎이는 것**" — 빅테크 회사채 스프레드·2027 CapEx 가이던스(1~2월)·
  하이일드 스프레드(⑪ W2)를 본다. ⚠️ 영상 요약의 "FCF 적자 386% 확대"는
  변화율(−386%)을 잘못 읽은 표현.
