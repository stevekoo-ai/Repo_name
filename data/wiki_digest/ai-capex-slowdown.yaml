slug: ai-capex-slowdown
status_label: "🟡 AI 속도조절론 — 질문이 바뀌었다: '투자가 주는가'가 아니라 '전기를 못 구하는가'(메모리는 이미 팔린 상태)"
as_of: "2026-09-18"
one_line_summary: >
  9/16에 "숫자가 반대로 확인됐다"고 적었는데 오늘은 **원인까지 규명**됐다.
  ⓐ 인텔 CEO 립부 탄(9/15 AI 인프라 포럼): AI 구축·메모리 수요 **둔화 없음**,
  **부족은 내년 더 심화**, 가격 **이미 5~7배(500%+) 상승**, 보급형 폰·노트북
  원가의 70~80%가 메모리 — 9/17 마이크론 +5% ⓑ **메타가 CapEx $125~145B
  상향 사유로 "메모리 칩 가격 상승"을 직접 지목** — 메모리 가격이 CapEx를
  끌어올리는 **원인**이다 ⓒ 진짜 병목은 **전력**: MS는 전력 부족으로 못 채운
  Azure 수주 **$80B**, 전체 백로그 **$625~627B(전년 2배)**, 북버지니아·텍사스
  일부는 전력 소진으로 **신규 접수 중단**, 액체냉각 납기 18개월+ ⓓ pacing은
  **정책 지원을 잃었다** — 트럼프 "HOAX", 백악관 AI 차르 색스 "규제 포획".
  → **이 축의 질문이 바뀌어야 한다**: "AI 투자가 주는가"가 아니라 "짓고 싶어도
  전기를 못 구하는가"다. 둘은 집행 지연이라는 결과가 같아 보이지만 메모리
  함의는 정반대 — 전자는 주문 취소, 후자는 **이미 팔린 메모리의 인도 지연**이다.
  ⚠️ 단정 금지 사유: 인텔 CEO는 메모리 재진입·하이닉스 협의라는 이해가 걸린
  화자이고, 다음 공식 CapEx 갱신은 10월 말~11월 초 실적이며, 전부 스니펫 기반이다.
