slug: ai-capex-slowdown
status_label: "🟡 AI 속도조절론 — 여전히 서사 단계, 그러나 숫자는 반대로 확인(아마존 CapEx $220B 상향)"
as_of: "2026-09-16"
one_line_summary: >
  전환 판정 기준의 반대 방향이 확인됐다. 빅테크 CapEx 가이던스는 하향이
  아니라 **상향** — 아마존이 2026년 계획을 약 $200B에서 **약 $220B로** 올렸고
  (부품가 상승·AWS/AI 대응), 구글 $195~205B·MS ~$190B·메타 $130~145B로
  4사 합산 **약 $725B, 전년 대비 +77%**다. 아모데이 에세이("We Must Pace the
  Frontier", 9/12)의 대상도 **프런티어 훈련 런에 한정**이며 서비스 제공·연구
  중단은 요구하지 않는다 — 2026년 컴퓨트의 **약 2/3는 추론**이고 HBM 2026년
  생산분은 사실상 완판이라, 제안과 메모리 수요 사이 연결고리는 원래 약했다.
  엔비디아 황 CEO는 공개 반박했고 모건스탠리는 둔화 공포를 "laughable"로
  평가했다. 따라서 단계는 **여전히 서사(밸류에이션 재평가 압력)**이되 숫자
  단계로 넘어갈 근거는 **오히려 약해졌다**. 단정하지 않는 이유: 상향분 일부가
  **부품가 상승** 기인이라 물량 증가와 함의가 다르고, 다음 공식 가이던스는
  10월 말~11월 초 실적이라 그때까지 서사가 가격을 지배할 수 있다. 별개 축인
  전력·인허가 병목은 유지(전력이 GPU를 제친 1순위 병목, SK하이닉스 신규 HBM
  캐파는 2028~29 목표) — 공급 타이트를 연장하는 방향이라 부호가 반대다.
