slug: ai-capex-slowdown
status_label: "🟡 AI 속도조절론 — 서사 단계, 숫자(CapEx 가이던스) 미확인"
as_of: "2026-09-14"
one_line_summary: >
  앤트로픽 CEO의 개발 속도조절 촉구(주말)가 AI 공급망 전반 매도로 번져
  2026-09-14 코스피 -3.26%(6,680선), 반도체주 급락. 핵심 구분은
  "서사인가 숫자인가" — 지금까지는 정책 톤의 제안이지 빅테크 CapEx
  가이던스 실제 하향이 아니다. 서사 단계는 밸류에이션 재평가 압력이고
  숫자 단계는 수요 축소 확정으로, 하이닉스에 미치는 성격이 전혀 다르다
  (멀티플 압축 vs 물량·가격 동시 훼손). 전환 판정 기준: 빅테크 3사
  (MS·구글·메타) 중 2곳 이상이 분기 CapEx 가이던스를 하향하면 숫자 단계.
  별개로 전력·인허가 병목(2026년 미국 물량 절반 중단·지연 위기)이
  병존하는데, 원인은 다르나 결과(집행 지연)는 같으므로 섞지 않는다.
