slug: rate-outlook-scenario
status_label: "🟡 금리 전망 3대 진영 — 축③ 장기금리 임계 위로 돌파(10년물 5.225%·30년물 5.502%), 고금리 뉴노멀 우세 고착"
as_of: "2026-09-28"
one_line_summary: >-
  축③ 장기금리가 **임계를 위로 돌파**했다. 2026-09-25 미 10년물 장중 **5.225%
  (2007년 이래 최고)**, **30년물 5.502%(2004년 이래 최고)**로 자금계획 경보선
  5.5%를 넘었다(팩 10년물 5.18%, 5일 +25bp). 고금리 뉴노멀 진영 우세가 더
  굳어져 하방 안정 진영(≤4.3%)은 연말까지 **90bp 이상** 하락이 필요하다
  (9/17 시점 70bp보다 멀어짐) — P0008 유리, P0009 크게 불리.
  ⚠️ ⓐ **주식은 이 금리 상승을 무시했다**(같은 날 나스닥 사상 최고권, VIX
  14.87) — 금리·위험자산 디커플링 국면이므로 "금리↑→주가↓"를 자동 연결하지
  말 것 ⓑ **유가는 반대로 내려왔다**(브렌트 $104.32, 5일 -12%대). 9/17에
  "정책 요인과 공급 충격을 분리 못 한다"고 적었으나, 공급 충격이 빠지는데도
  금리가 올랐으므로 이번 상승분은 **정책·재정 쪽으로 귀속**하는 것이 맞다.
  축①은 9월 FOMC로 매파 우세 확정(변화 없음), 남은 분기점은 10/22 금통위(P0007).
