slug: rate-outlook-scenario
status_label: "🟡 금리 전망 3대 진영 — 디커플링 부분검증, 장기금리는 고금리 뉴노멀 쪽"
as_of: "2026-09-12"
one_line_summary: >
  세 진영(비둘기/매파/정치적 딜레마)이 "과감한 추가 인상 없음"엔 동의하나
  그 다음이 갈린다. 실측 대조: 한국은행은 실제로 2.50%→2.75%→3.00%로
  2회 인상해 "ECB·BOK 디커플링" 주장이 이미 부분 검증됐고, 엔화도
  159.74→156.11로 강세 방향 확인. 반면 장기금리(us_10y 4.95%)는 하방
  안정 진영(≤4.3%) 고금리 진영(≥4.5%) 임계 둘 다 위에 있어 아직 고금리
  뉴노멀에 더 가깝다. 다음 분기점은 9/15~16 FOMC(P0006)와 10/22 금통위
  (P0007) — 두 결과가 나오면 축①·②의 승자가 갈린다.
