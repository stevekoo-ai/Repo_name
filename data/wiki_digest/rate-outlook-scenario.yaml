slug: rate-outlook-scenario
status_label: "🟡 금리 전망 3대 진영 — 9월 FOMC 25bp 인상 확정으로 축① 매파 우세, 비둘기 진영 탈락"
as_of: "2026-09-17"
one_line_summary: >
  분기점 하나가 지나갔다. 2026-09-16 FOMC가 **25bp 인상**을 12-0 만장일치로
  결정(목표범위 **3.75~4.00%**, 3년여 만의 첫 인상), 점도표는 18명 중 16명이
  **추가 1회 이상**을 예상하고 이후 연도엔 인상이 없다(2028·2029 각 1회 인하).
  → 축① **매파 진영 우세로 확정 방향이며 "인상 자체가 없다"고 본 비둘기
  진영은 탈락**한다. 다만 세 진영이 공유한 전제("과감한 연속 인상은 없음")는
  점도표가 추가 1회만 가리키므로 **유지**된다. 축② 디커플링은 부분 검증 유지
  (한은 2.50→2.75→3.00%), 단 연준이 실제로 올려 금리차 압박이 일부 해소된
  만큼 **10/22 금통위 3차 인상(P0007)의 명분은 오히려 약해졌다**. 축③은
  고금리 뉴노멀 쪽으로 더 벌어짐 — us_10y **5.00%**(9/15 장중 5.045%로
  2007년 이래 최고), 하방 안정 진영이 맞으려면 연말까지 70bp 이상 하락 필요.
  P0006(us_fed_funds ≥ 3.85)은 사실상 적중 확정, 남은 분기점은 10/22 금통위.
  ⚠️ 금리 상승을 연준 단독으로 귀속하지 말 것 — 같은 기간 브렌트 현물
  $130.80(백워데이션 $22.05)·호르무즈 통항 전쟁 전 2%로, 정책 요인과 공급
  충격이 장기금리에 동시에 실려 있고 fx-regime 축에서 둘의 함의는 정반대다.
