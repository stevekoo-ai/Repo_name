slug: rate-outlook-scenario
status_label: "🟡 금리 공포는 실재, 장기금리는 이미 하락 — 10년물 10/5 5.31% 고점 → 10/22 4.96%, 시험대는 10/29 새벽 FOMC"
as_of: "2026-10-28"
one_line_summary: >-
  9월 CPI는 전체 +3.74%·근원 +2.56%로 예상 상회(휘발유 +9.1%), 유가는
  선물 10/23 116.7달러로 재상승 중이다. 10월 FOMC 인상 확률은 CPI 직후
  보도 기준 45.9%까지 올랐지만, 미국 10년물은 10/5 5.31% 고점에서 10/22
  4.96%로 이미 내려왔다. 10/12~15 하이닉스 폭락은 금리 수준보다 CPI 서프라이즈
  + AI 부채 충격 + 헤지펀드 청산의 동시 발생이 설명력이 높다. 시험대는
  10/28 하이닉스 가이던스 → 10/29 새벽 FOMC → 11/3 선거 순서다.
  10/26 대조: 고금리는 확인(1년 새 한국 10년물 +119bp·미국 +94bp)이나, 원/달러는
  10/23 1,324.6으로 1년 최저라 '고환율 뉴노멀' 주장은 지금 숫자와 반대다.
  10/27 이란 최고지도자가 종전 조건을 제시해 WTI 99.90·Brent 선물 약 109로
  급락했지만(합의 없음) 10년물은 4.99% 보합 — 유가→금리 압박 완화는 아직
  금리에 반영되지 않았다. FOMC는 동결 기정사실, 매파 성명 여부가 변수다.
