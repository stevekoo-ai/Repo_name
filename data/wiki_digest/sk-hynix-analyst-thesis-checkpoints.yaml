status_label: "🟡 강세 리포트 2건 vs 약세론 1건 — 업황 정점론은 마이크론 가이던스로 반박, 환율·중국은 유효"
one_line_summary: >-
  약세론(이주환): 출하량 급감·인위적 감산은 9월 반도체 수출 603억 달러(물량 확대+고정가 상승)와
  마이크론 증설로 반박. 3Q 업황 정점론은 마이크론 다음 분기 가이던스 $61.5B(+13% q/q)와 충돌.
  유효한 지적: 성장 동력은 가격(ASP +17~20% vs 출하 +7%), 환율로 4Q 원화 이익 둔화 가능
  (3Q 평균 −5.2%, 현 수준이면 4Q −4.6%), 중국 위협(⑦ 격상), 정점 이익의 낮은 PER 함정.
  시험대: 10월 하순 3Q 발표의 4Q 가이던스. TP 340만(9/30 A), 스펙트럼 280만~470만.
