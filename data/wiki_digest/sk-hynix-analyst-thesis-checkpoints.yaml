status_label: "🟢 10/28 시험대 통과 — 3Q 어닝 서프라이즈·4Q D램 출하 +20% 중반 가이던스로 피크아웃론 반박(약세 근거는 CXMT·외국인 수급·원화 강세)"
one_line_summary: >-
  10/28 3Q 실적: 매출 104.6조·영업이익 83.3조(증권사 추정 대비 약 +10%·+13%),
  D램 비트 출하 약 +10%·ASP 20% 후반 상승으로 물량과 가격이 함께 늘었다.
  4Q 가이던스는 D램 출하 +20% 중반 q/q, HBM4가 HBM3E를 추월, 2027년 HBM
  가격·물량 협의 완료, 2029년까지 D램·HBM 사실상 솔드아웃. 10/2 피크아웃론은
  최소 4Q까지 반박됐고 커스텀 HBM론은 방향 지지(비중 숫자 미공개). 주주환원
  FY26 약 100조. 남은 약세 근거는 CXMT, 외국인 20일 누적 순매도, 원화 강세,
  "요청 물량 2배·3년 솔드아웃"에 섞일 수 있는 가수요(채찍 효과, 판정 보류).
