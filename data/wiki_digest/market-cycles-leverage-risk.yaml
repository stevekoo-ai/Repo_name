status_label: "🔴 찐반등 4대 신호 0/4 — ①빚의청산 재점화(신용융자 급락 와중 +18%), CapEx는 되레 상향 확인"
one_line_summary: >-
  **①빚의청산 시험대 데이터 도착** — 09-14(-7.12% 급락일) 신용융자잔고가
  503,988주(+76,840, 09-11 대비 **+18%**)로 오히려 늘었다. 급락 구간
  레버리지 확대는 반대매매 압력 축적 신호일 수 있으나, 09-10 +63%
  스파이크가 하루 만에 소멸한 전례가 있어 다음 1~2거래일 추이 확인 전엔
  단정하지 않는다. ②③④는 09-15 아침 판정 유지(②미충족 ③악화연장
  ④동반확인·하락방향, 오늘 팩엔 digest 미선별로 재확인 불가).
  **완전충족 여전히 0/4.** 배경: 09-14 급락 재료 AI속도조절론에 반박
  근거 추가 — 아마존이 2분기 2026 CapEx 가이던스를 2,000억→2,200억달러로
  **상향**(메모리가·AI수요 근거), 빅4 합산 $7,350~7,600억 유지. 반면
  미 10년물은 09-15 장중 **5.03%**(2007/7 이후 최고)·CME 인상확률
  한때 92.3% — 시장을 누르는 축은 반도체 수요가 아니라 **금리**라는
  게 이틀째 확인 중.
