status_label: "🔴 찐반등 4대 신호 0/4 — ①빚의청산 반전(신용융자 -37%, 09-11 기준선 이하), 가격·레버리지 개선 vs 외국인수급 디커플링"
one_line_summary: >-
  **①빚의청산 반전** — 09-14 급증(503,988주, +18%) 경고가 09-15 실측
  318,949주(-185,039, -37%)로 뒤집혔다. 09-11 기준선(427,148)보다도
  낮아 레버리지 순감 확인 — 같은 날 하이닉스 +2.54%(1,733,000원) 반등,
  개인 5거래일 +0.82조 순매수 전환과 겹쳐 정합적이나, 이 축이 이틀
  연속(+18%→-37%) 크게 흔들린 전례가 있어 1회 실측만으론 신호 '충족'
  확정하지 않는다. ②③④는 09-15 아침 판정 유지(오늘 팩 digest
  미선별로 재확인 불가) — ③외국인귀환은 5거래일 -5.85조로 오히려 더
  악화(가격·레버리지 개선 vs 외국인수급 미해소, **디커플링** 구도).
  **완전충족 여전히 0/4.** 배경: AI속도조절론 반박 근거 사흘째 축적 —
  아마존 이어 마이크로소프트도 2026 CapEx 1,900억달러(+130%YoY)로
  상향, 09-16 젠슨 황(엔비디아 CEO)이 트럼프와 함께 속도조절론
  공개 반박. 오늘 밤(9/17 새벽 3시 KST) FOMC 결과가 이 반등의 최대
  변수.
