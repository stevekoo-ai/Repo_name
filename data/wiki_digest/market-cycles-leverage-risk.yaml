  **순매수 전환은 아니다**(9/1~10/23 누적 -21.95조). 투매 종료 3신호(신용
  정리 완료·시장 폭 회복·외국인 순매수 전환) **0/3 충족** — 신용잔고
  10/12→10/23 -13.2%로 정리는 진행 중, 코스피 상승:하락 종목 173:719.
  복원 판정 기준은 같은 3신호이며, 10/28 실적 가이던스가 수급과 별개로
  펀더멘털을 확인한다.
