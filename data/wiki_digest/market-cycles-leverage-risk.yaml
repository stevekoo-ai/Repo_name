status_label: "🔴 찐반등 4대 신호 0/4 — ①빚의청산 해석 보류(이번 주 세 번째 대형 반전), 외국인은 반도체→방산 로테이션 중"
one_line_summary: >-
  **①빚의청산 해석 보류로 전환** — 신용융자잔고가 09-14 +18%, 09-15
  -37%, 09-16 **+68%**로 이번 주 세 번 연속 하루 만에 방향이
  뒤집혔다. 매일 반대 판정을 내리는 패턴 자체가 "하루치 단독으론
  못 읽는다"는 신호로 보고, 이후 최소 3거래일 추세로만 인용하기로
  판단 방법을 바꿨다(KIS 실측 자체를 의심하는 것은 아님). ②③④는
  digest 미선별로 직전 판정 유지 — ③외국인귀환 추가 악화 근거(오늘
  코스피 오후 외국인 매도 -2.3조 확대, **반도체→방산·조선 로테이션**
  패턴 반복 확인). **완전충족 여전히 0/4.** 배경: SK하이닉스·인텔
  미국 현지 메모리 생산 합작 협의 보도(로이터), 인텔 CEO "메모리
  가격 5~7배 상승" 발언 — ①DRAM/NAND가격 체크포인트 강화. FOMC는
  09-16 25bp 인상(3.75~4.00%)으로 지나갔고 나스닥이 크게 안 흔들려
  선반영 확인.
