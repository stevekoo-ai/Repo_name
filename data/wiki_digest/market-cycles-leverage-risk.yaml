status_label: "🔴 찐반등 4대 신호 0/4 — ④미국동반 미확정 해소(ADR -7.58% > 국내 -7.12%), '국내 과잉반응' 가설 기각"
one_line_summary: >-
  ④미국동반 **미확정 해소** — 9/14 미국 세션에서 SOX -5.9%, 마이크론 -5.89%,
  SK하이닉스 ADR **-7.58%**($175.67)로 국내 종가 낙폭(-7.12%)보다 더 빠졌다.
  국내가 더 판 게 아니라 미국이 더 팔았으므로 코스피 -3.26%는 국내 단독
  과잉반응이 아니라 **글로벌 동반 재평가**다. 단 이는 하락 동반이라 *반등*
  신호 충족이 아니며 **완전충족 여전히 0/4** ③외국인귀환 **악화 연장**
  (5거래일 -4.67조로 직전 -1.23조의 3.8배, 보유율 50.47%→50.27%)
  ②개미의항복 미충족 유지(개인 5거래일 -0.57조로 직전 -5.23조 대비 대량
  순매도가 멈춤 — 항복이 아니라 관망) ①빚의청산 재관찰 유지(신용융자가
  9/11 427,148주에서 4일째 미갱신, 급락 구간 반대매매 압력은 데이터로 확인
  불가). 급락 재료인 AI속도조절론은 역량 속도 제안이지 CapEx 삭감 발표가
  아니고, 하이퍼스케일러 2026 가이던스($720~745B) 삭감은 오늘 조사에서도
  확인되지 않았다 — 다음 확인은 10월 말~11월 초 실적, 6주간 공백.
