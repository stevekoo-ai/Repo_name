one_line_summary: >-
  ①빚의청산 **미충족(역방향)** — 9/7·9/8 연속 감소로 부분조짐이었으나
  9/10 신용융자잔고가 630,344주(+244,319, 하루 +63%)로 뒤집혔다. 하락 국면에서
  레버리지가 늘면 반대매매 압력이 커진다 ②개미의항복 미충족(9/1~9/8 개인 -7.04조
  순매도지만 주가는 +12% 상승 중 → 패닉이 아니라 차익실현, 신호 정의와
  성격이 다름) ③외국인귀환 부분개선(20일 누적 -1.74조로 여전히 순매도
  우위이나 최근 5거래일은 +0.60조 순매수 전환) ④미국동반 엇갈림(9/8 미
  3대지수 전부 하락했으나 반도체는 개별 강세, SK하이닉스 ADR +4.83%가
  9/9 KRX 급등의 직접 트리거). 완전충족은 여전히 0/4지만 4개 신호가 동시에
  좋아지는 조짐은 이 트래커 시작 이래 처음 — "찐반등 확정"엔 이르다.
