status_label: "🔴 찐반등 4대 신호 0/4 — ①빚의 청산 '역방향' 판정 철회(9/10 +63% 급증이 9/11에 소멸)"
one_line_summary: >-
  ①빚의청산 **미충족(중립·재관찰)** — 9/10 신용융자잔고 630,344주(하루 +63%)로
  "역방향" 판정을 내렸으나, 9/11 실측 427,148주(-203,196)로 급증분 대부분이
  하루 만에 되돌아왔다. 스파이크였을 뿐 추세적 레버리지 확대가 아니어서 역방향
  판정을 철회한다(단 9/8 이전 수준보다는 높아 "청산 진행"도 아니다)
  ②개미의항복 미충족(9/1~9/8 개인 -7.04조 순매도지만 주가는 +12% 상승 중 →
  패닉이 아니라 차익실현, 신호 정의와 성격이 다름) ③외국인귀환 미해소(최근
  5거래일 외국인 -1.23조로 9/11 시점의 +0.60조 순매수 전환이 다시 역전,
  외국인 보유율 50.47%) ④미국동반 엇갈림(9/11 미 3대지수 반등·하이닉스 ADR
  +0.94%였으나 국내는 -2.21%로 괴리가 국내 할인 방향). 완전충족 여전히 0/4 —
  1일치 실측으로 판정을 뒤집는 일이 이틀 연속 벌어졌으므로 2~3거래일 추이
  확인 전엔 어느 방향도 단정하지 않는다.
