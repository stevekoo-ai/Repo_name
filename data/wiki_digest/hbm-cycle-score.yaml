status_label: "🔴 붕괴조건 1/5 충족(④ 외국인 순매도) — ⑤반도체수출은 28일 만에 +155.4%→+270.1%로 가속"
one_line_summary: >-
  붕괴조건 **여전히 1/5 충족**(④만). ⑤반도체수출이 28일 만에 갱신됐고 방향은
  둔화가 아니라 **가속**이다 — **9월 1~10일 반도체 수출 165억 달러, YoY
  +270.1%**(직전 기록 +155.4%), 총수출 349.7억 달러(+82.6%) 중 **반도체 비중
  47.1%**, 무역수지 103.7억 달러 흑자. "AI 투자 둔화로 메모리 수요가 꺾인다"는
  서사에 대한 **통관 실적 기준의 반증**이며, 전망이 아니라 실적이라 이 축에서
  가장 단단한 근거다. ④외국인 20일 누적 순매도는 **충족 유지**(최근 5거래일만
  으로 -3.43조). ⚠️ 그럼에도 **100점 재계산은 계속 보류** — ①ASP·②엔비디아
  주문·③CoWoS가 **28일째 빈칸**이고 이 셋은 선행 지표라 후행 실적인 ⑤로
  대체할 수 없다. ⑤가 좋아진 것과 ①②③을 모르는 것은 별개 사실이다.
  다음 확인 지점: 9/21 관세청 9월 1~20일 잠정치(추정, 미발표) → 10/1 확정치.
