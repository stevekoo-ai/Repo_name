status_label: "🟡 엔캐리 1차 경고 — CFTC 청산 확인, 그러나 USD/JPY는 오히려 반등해 2차 확정 아님"
as_of: "2026-09-22"
one_line_summary: >
  CFTC(2026-09-08 발표분, [사용자 제공]): JPY Leveraged Funds Net -49,098
  (전주 대비 Short -29,859·Long +23,231, Non-Commercial 전체는 -92,227→
  +10,796으로 103,023계약 급변, 2월 이후 첫 순매수 전환) — **포지션은
  크게 청산됐다.** 그런데 USD/JPY는 9/11 153.55→9/18 157.28로 **오히려
  반등**, BOJ가 9/18 금리를 1.25%로 25bp 인상했는데도 엔화 약세 지속 —
  "금리인상→엔화강세→캐리청산"이라는 단순 서사와 반대. **판정: 1차
  경고는 발생, 2차 대규모 청산 국면 확정은 아니다.** 판단 전환 조건:
  CFTC Net이 0 이상 전환 AND USD/JPY 154 아래 지속 하락(시나리오 B,
  악화) / CFTC -70,000 이하 재확대 AND USD/JPY 158~160 유지(시나리오
  A, 되돌림). SK하이닉스 관련해선 사용자가 지정한 "엔화 강세+미
  장기금리 상승+나스닥 하락" 3중 동시발생이 핵심인데 오늘은 3개 중
  1개(미 장기금리)만 충족 — 실질 경고 단계 아님. ⚠️ CFTC·일본10년물은
  이 저장소 자동 수집 미구현, 사용자 제공치에 의존 중(다음 CFTC
  발표는 9/15분, 통상 익주 금요일).
  🆕 2026-09-22: 이 축이 **주거자금 실행계획에 코드로 연결됐다** — 사전 경보
  EW1(원화 마지노선 접근)의 `companion_axis`라서, 이 digest의 status_label이
  🔴로 바뀌면 EW1이 warning→critical로 자동 승격되고 브리핑 블록 ⑧에 뜬다.
  원/달러가 1,383.8원으로 CP5 마지노선(1,400)까지 16원뿐이라, 엔캐리가
  시나리오 B로 넘어가면 두 경로가 원화를 동시에 민다.
