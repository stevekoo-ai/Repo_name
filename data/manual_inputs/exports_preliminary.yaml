# Manual input — 관세청 10일 단위 수출입 현황 [잠정치] (Master Instruction 7.3
# 반도체 특화 데이터 예외 정책과 같은 종류의 예외: 진행 중인 달의 최종
# 수치가 아니라, 관세청이 그 달이 끝나기 전에 미리 공개하는 부분기간
# 잠정치다).
#
# 2026-08-17 사용자 요청 — "다음 수출입통계는 9월1일에 발표하는 건가? 근데
# 그 전에 어느 수준인지 알 수 있는 방법이 있어?" 답: 있다. 관세청은 매달
# 1~10일 잠정치(그 달 11일 발표), 1~20일 잠정치(21일 발표)를 최종치(다음
# 달 1일)보다 먼저 공개한다.
#
# 중요한 구분: 여기 적힌 달러 금액·%YoY 자체는 관세청이 실제로 발표한 진짜
# 숫자다(추정 아님, source에 원문 링크). 하지만 "이 부분기간의 %YoY를 그 달
# 전체의 %YoY로 쓴다"는 건 이 파이프라인이 하는 근사(proxy)이지 관세청의
# 주장이 아니다 — 상반월/월 전체의 조업일수·통관 타이밍(특히 반도체는
# 대형 계약 클리어런스가 월말에 몰리는 경우가 잦음)이 달라서 실제 월
# 최종치와 다를 수 있다. 그래서 correlation_analysis.py는 이 값을
# total_exports_yoy(실측)에 절대 섞지 않고, 차트에 점선/속이 빈 마커로
# 별도 표시하며 "잠정치 추정"이라고 항상 라벨을 붙인다.
#
# 갱신 방법: 매달 11일(1~10일)·21일(1~20일) 관세청 보도자료가 나오면 이
# 파일의 latest 블록을 그 값으로 덮어쓴다(과거 갱신 이력은 history에
# 남긴다) — 1~20일 값이 나오면 1~10일보다 그쪽이 더 표본이 크므로 그걸
# 최신으로 쓴다.

