# Manual input — KOSPI 연말(그 해 마지막 거래일) 종가. 2026-08-15: 사용자
# 요청("가장 길고 오래된 데이터를 모두 가져와서")로 신설.
#
# 왜 KIS 실시간 API가 아니라 수동 파일인가: scripts/investor_flow.py
# monthly-history(KIS TR FHKST03010100)가 있지만 이 샌드박스는 KIS 키가
# 없어 실호출 불가 — 과거 연도까지 채우려면 지금 당장은 이 경로뿐이었다.
# WebFetch는 이 환경에서 전면 차단(namu.wiki/investing.com/kosis.kr/
# wikipedia.org/stooq.com/query1.finance.yahoo.com 전부 EGRESS_BLOCKED로
# 확인) — WebSearch(스니펫이 아니라 실제 기사 본문까지 종합해서 답하는
# Anthropic 자체 검색)로만 확보했다. 각 행은 그 날짜의 종가를 직접 보도한
# 기사 1개 이상을 인용한다 — 여러 매체가 같은 한국거래소 발표를 동일 숫자로
# 인용하는 것으로 교차검증을 대신했다(예: 2019년 종가 2197.67은 기사 자체가
# "전년말 대비 7.7% 상승"이라고도 명시해, 앞뒤 연도 종가로 계산한 YoY와
# 맞아떨어지는지 자체 검증 가능했음).
#
# KIS 월봉이 실제로 수집되기 시작하면(core10 계열과 무관, exports-price-
# correlation.yml이 sources/monthly-price-history.csv에 채움) 이 파일과
# 겹치는 연도는 KIS 실측이 우선이어야 한다 — correlation_analysis.py의
# 로더가 그 우선순위를 구현한다.

