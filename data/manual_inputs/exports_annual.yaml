# Manual input — annual (연간) 총수출/반도체수출 증가율, separate from
# exports.yaml's monthly series. 2026-08-15: 사용자 요청("가장 길고 오래된
# 데이터를 모두 가져와서") — 월별 실측은 2026-04부터뿐이라(exports.yaml),
# 상관관계 표본을 늘리려고 산업통상자원부 연간 결산 보도자료를 거슬러 올라가
# 찾은 것. 매년 1월 발표되는 "OO년 연간 수출입 동향"이 출처.
#
# 표시 규칙: %YoY가 보도자료에 직접 명시된 해는 그 숫자를 그대로 쓴다
# (source: "발표값"). 직접 명시가 없어 두 해의 달러 총액에서 계산한 경우는
# "계산값"으로 표시하고 계산에 쓴 두 금액을 주석에 남긴다 — 서로 다른 기사의
# 반올림된 달러 총액을 나눗셈하면 발표값과 어긋날 수 있다는 걸 이번에 직접
# 겪었다(2018→2019 총수출: 6,055억→5,242.1억을 나누면 -13.4%가 나오지만
# 2019년 보도자료 발표값은 -10.3% — 확정치/잠정치 시차 등으로 두 해 금액이
# 완전히 같은 기준이 아니었을 가능성). 그래서 이 파일은 계산 대신 **발표값
# 우선** 원칙을 따른다 — 발표값이 없는 해(2018)는 억지로 계산해 채우지
# 않고 비워둔다.
#
# WebSearch로 확보(source: WebSearch, 다수 매체가 동일 산업통상자원부
# 보도자료를 인용 — 아래 각 행 주석에 대표 출처 1개씩 표기). 이 환경은
# WebFetch가 전면 차단돼 있어(namu.wiki/investing.com/kosis.kr/wikipedia
# 등 전부 EGRESS_BLOCKED) 원문 재확인은 못 했다 — 발표값 하나로 여러 매체가
# 교차 인용하는 것으로 검증을 대신했다.

updated_at: "2026-08-15"
series:
  total_exports_yoy:               # 총수출 증가율 (%, YoY, 연간)
    - { date: "2019-01-01", value: -10.3 }  # 5,242.1억 달러. 발표값
    - { date: "2020-01-01", value: -5.4 }   # 5,128.5억 달러. 발표값
    - { date: "2021-01-01", value: 25.8 }   # 6,445억 달러, 사상최대. 발표값
    - { date: "2022-01-01", value: 6.1 }    # 6,839억 달러, 2년연속 사상최대. 발표값
    - { date: "2023-01-01", value: -7.0 }   # 6,327억 달러. 발표값
    - { date: "2024-01-01", value: 8.2 }    # 6,838억 달러, 사상최대 재경신. 발표값
    - { date: "2025-01-01", value: 3.8 }    # 7,097억 달러, 최초 7,000억 돌파. 발표값
  semiconductor_exports_yoy:       # 반도체 수출 증가율 (%, YoY, 연간)
    - { date: "2019-01-01", value: -25.9 }  # 1,267.1억→939.4억 달러. 발표값
    - { date: "2020-01-01", value: 5.6 }    # 939.4억→992억(99.18억$×10) 달러, 역대 2위. 발표값
    - { date: "2021-01-01", value: 29.0 }   # 총수출 25.8%보다 높은 품목별 증가율. 발표값
    - { date: "2022-01-01", value: 0.9 }    # 계산값 — 1,280억→1,292억 달러(둘 다 타 기사 인용, 발표 %YoY 미확인)
    - { date: "2023-01-01", value: -20.0 }  # 메모리 다운턴. 발표값("전년비 20% 감소")
    - { date: "2024-01-01", value: 43.9 }   # 1,419억 달러, 역대 최대. 발표값
    - { date: "2025-01-01", value: 22.1 }   # 1,753억 달러, 전체 수출의 24.7%. 발표값(ICT 반도체 기준)
