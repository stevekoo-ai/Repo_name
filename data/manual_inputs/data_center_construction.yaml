# Manual input for 미국 데이터센터 건설 반대 vs 실제 착공(ConstructConnect) 지표
# (Master Instruction 7.3 예외 정책 — ConstructConnect·Data Center Watch 모두
# 무료 공개 API가 없어 매달 보도자료/WebSearch로 수동 갱신한다).
#
# 이 지표는 HBM Cycle Score의 "고객재고"(수요 지속성) 축을 보조하는 참고
# 신호다 — SEC EDGAR CapEx 실측(하이퍼스케일러 지출)과 마찬가지로 "AI 인프라
# 수요가 실제로 land 위에서 지어지고 있는가"를 보여주지만, 이 파일의 데이터는
# **점수화하지 않는다** — 건설 반대(정치/규제 리스크)와 착공 실적(경제적
# 수요)이 같은 시점에 정반대 방향으로 움직이는 긴장 관계이고, 이를 하나의
# 숫자로 합성할 신뢰할 만한 방법론이 아직 없기 때문(Concept Before
# Conclusion — 새 스코어링 방법론을 임의로 만들지 않는다). 리포트에는 원자료만
# 그대로 노출하고, 해석은 wiki/concepts/data-center-construction-vs-opposition.md
# 에서 사람이 갱신한다.
#
# 2026-08-27: 최초 생성 — 세션 내 WebSearch 조사 결과(오늘 대화)를 반영.

