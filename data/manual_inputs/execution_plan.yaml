# 주거 전환 자금 조달 — 실행 계획 (매도 tranche · 판단 포스트 · CDP)
#
# ## 왜 이 파일이 코드가 아니라 데이터인가
#
# 계획은 바뀐다. 바뀔 때 코드를 고치면 "왜 바꿨는지"가 diff에 묻힌다.
# 계획을 데이터로 두면 engine/execution/plan.py는 판정만 하고, 변경 이력은
# 이 파일의 git 로그에 남는다 — 사장님이 "그때 왜 이 조건이었지"를
# 되짚을 수 있어야 한다(Traceability).
#
# ## 설계 원칙 세 가지
#
# 1. **금액 기반, 주수 기반이 아니다.** 주가가 오르면 같은 금액을 더 적은
#    주수로 조달할 수 있다. 주수를 고정하면 상승분을 스스로 버린다.
#      1,400,000원 → 1.29억에 92주 필요
#      2,400,000원 → 1.29억에 54주 필요 (38주 절약)
#
# 2. **시간 하한선 + 가격 앞당김의 이중 구조.** 데드라인이 있는 매도는
#    고점을 맞히는 게임이 아니라 최악을 피하는 게임이다.
#      - floor: 그 날짜까지 반드시 확보해야 할 누적 조달액. 미달이면 강제.
#      - accelerator: 가격이 임계 이상이면 다음 tranche를 앞당긴다.
#
# 3. **전제는 반증 가능해야 한다.** "그때 가서 보자"가 아니라 조건과
#    검증일을 지금 박아둔다. 틀리면 틀렸다고 기록된다(R3: 미수집은 판정이 아니다).
#
# ## 2026-09-12 실측으로 뒤집힌 전제 (중요)
#
# v2·v3 보고서는 "하이닉스 고점 부근 → 매도에 유리"라고 썼는데,
# sources/sk-hynix-price-snapshot.csv 실측은 정반대였다:
#   250일 고점 2,987,000원(2026-06-25) 대비 현재 1,812,000원 = **-39.3%**
#   7/30 저점 1,322,000원 대비 +37.1% 반등 중
# 위키 서술("$1조 클럽")만 보고 가격을 대조하지 않은 결과다.
# → "지금이 매도 적기"라는 근거는 없다. 그래서 이 계획은 조기 대량매도를
#   하지 않고, 최소 실행량만 시간으로 확보한 뒤 회복 구간에서 앞당긴다.

version: 2
updated_at: "2026-09-12"
owner_note: "sources/sk-hynix-price-snapshot.csv 실측 기준. 주가 변동 시 주수는 자동 재계산된다."

target:
  # 목표 조달액 — 보고서 v3 §6 안전마진 110% 기준
  amount_krw: 128652000
  minimum_krw: 56161368          # 안전마진 100% (목표 세후 32,400,000원 달성 최소선)
  deadline: "2027-02-19"          # 이사 전날 — 이 날까지 조달 완료
  rationale: >
    월세 2,700,000원/월 = 연 세후 32,400,000원을 만들기 위한 인컴 베이스 확충분.
    절세 3층 구조(ISA 우산 + 아내 명의 분산 + 상품별 과세특례) 적용 기준이며,
    설계가 없으면 229,872,833원이 필요하다.

position:
  ticker: "000660"
  name: "SK하이닉스"
  total_shares: 249
  locked_shares: 67               # 하나증권, 2027-02-11까지 매도 시 마크업 소멸
  lock_until: "2027-02-11"
  lock_markup_krw: 8791650
  free_shares: 182                # 249 - 67

# ── 매도 tranche ────────────────────────────────────────────────
# amount_krw = 이 tranche에서 조달할 금액. 주수는 실행 시점 가격으로 나눈다.
# floor_by   = 이 날짜까지 누적 조달이 cumulative_floor_krw 미만이면 강제 실행.
# accelerate_if = 가격이 이 값 이상이면 창(window)보다 일찍 실행 가능.
tranches:
  - id: T1
    name: "실행 리스크 제거"
    window_start: "2026-10-01"
    window_end: "2026-10-31"
    amount_krw: 36000000
    cumulative_floor_krw: 36000000
    floor_by: "2026-10-31"
    mandatory: true
    accelerate_if: null
    rationale: >
      무조건 실행. 어떤 시나리오에서도 최소량은 확보해 "데드라인에 몰려
      아무 가격에나 던지는" 최악을 제거한다. 가격 판단이 아니라 실행
      리스크 관리다 — 이 tranche에는 가격 조건을 걸지 않는다.

  - id: T2
    name: "중간선거 통과 확인"
    window_start: "2026-11-04"
    window_end: "2026-11-30"
    amount_krw: 36000000
    cumulative_floor_krw: 72000000
    floor_by: "2026-11-30"
    mandatory: false
    accelerate_if: 2000000
    rationale: >
      미 중간선거(2026-11-03) 결과 확인 후 실행. 선거 전에 팔지 않는 이유는
      방향을 예단하지 않기 위해서다 — 이 저장소가 기록한 2026-07-30
      Situational Awareness 펀드 청산의 교훈은 "이벤트 자체보다 그 시점의
      레버리지·포지셔닝이 충격 크기를 결정한다"였다. 다만 선거 전이라도
      2,000,000원을 넘으면 앞당긴다(같은 금액을 더 적은 주수로 조달).

  - id: T3
    name: "연말 회복 구간"
    window_start: "2026-12-01"
    window_end: "2026-12-31"
    amount_krw: 27000000
    cumulative_floor_krw: 99000000
    floor_by: "2026-12-31"
    mandatory: false
    accelerate_if: 2200000
    rationale: >
      연말 배당락·리밸런싱 수급을 피해 실행. 2,200,000원 돌파 시 앞당긴다.

  - id: T4
    name: "PS 확정 후 잔여 조정"
    window_start: "2027-01-01"
    window_end: "2027-02-10"
    amount_krw: 29652000
    cumulative_floor_krw: 128652000
    floor_by: "2027-02-10"
    mandatory: false
    accelerate_if: 2400000
    rationale: >
      SK하이닉스 PS 실지급액·형태가 확정되는 구간. PS가 현금 1억으로
      들어오면 이 tranche는 축소하거나 생략할 수 있다 — 계획상 유일하게
      "줄어들 수 있는" tranche다. ISA 채권 만기(2027-01-18, 29,999,728원)도
      이 구간에 들어온다.

  - id: T5
    name: "락업 해제분 (예비)"
    window_start: "2027-02-11"
    window_end: "2027-02-19"
    amount_krw: 0
    cumulative_floor_krw: 128652000
    floor_by: "2027-02-19"
    mandatory: false
    accelerate_if: null
    rationale: >
      마크업 8,791,650원 수령(2027-02-11) 후에야 67주가 풀린다. 계획상
      조달액은 0 — T1~T4로 충당하는 것이 원안이다. 주가 급락으로 앞선
      tranche가 목표에 못 미쳤을 때만 쓰는 예비 물량이다.
      ⚠️ 2027-02-11 이전에 이 67주를 팔면 마크업이 소멸한다.

# ── 판단 포스트 (전제 검증) ──────────────────────────────────────
# 각 전제를 반증 가능한 조건으로 고정한다. 검증일이 오면 자동 채점되고,
# 틀린 전제는 틀렸다고 기록된다. thesis는 "무엇을 믿고 이 계획을 짰는가"다.
checkpoints:
  - id: CP1
    date: "2026-10-31"
    thesis: "하이닉스 반등이 이어져 조달 단가가 개선된다"
    check_key: hynix_close
    check_op: ">="
    check_value: 1900000
    if_false: "T2의 accelerate_if(2,000,000) 도달이 어려워진다 → T2를 창 끝(11/30)에 실행 전제로 재계산"

  - id: CP2
    date: "2026-11-03"
    thesis: "중간선거를 앞두고 변동성이 확대된다 (선거 전 매도 보류의 근거)"
    check_key: us_vix
    check_op: ">="
    check_value: 22
    if_false: "변동성 확대 전제가 틀렸다면 '선거 전 보류'의 근거가 약해진다 → T2 창을 앞당기는 것을 검토"

  - id: CP3
    date: "2026-11-30"
    thesis: "선거 통과 후 하이닉스가 2,000,000원대를 회복한다"
    check_key: hynix_close
    check_op: ">="
    check_value: 2000000
    if_false: "회복 경로 지연 → 필요 주수 증가. T3·T4 주수 재계산 및 잔여 보유 목표 하향"

  - id: CP4
    date: "2026-12-31"
    thesis: "고금리가 유지되어 인컴 자산 수익률 가정(명목 5.5%)이 성립한다"
    check_key: us_10y
    check_op: ">="
    check_value: 4.5
    if_false: "인컴 수익률 가정 붕괴 → 목표 조달액 자체를 상향해야 한다 (가장 파급이 큰 포스트)"

  - id: CP5
    date: "2026-12-31"
    thesis: "원화 강세가 이어져 해외형 커버드콜 배제 근거가 유지된다"
    check_key: kr_usdkrw
    check_op: "<="
    check_value: 1400
    if_false: "원화 약세 전환 시 해외형 커버드콜의 환손실 논거가 약해진다 → 상품 선정 재검토"

  - id: CP6
    date: "2027-01-31"
    thesis: "조달이 계획대로 진행돼 데드라인 압박 없이 마무리된다"
    check_key: hynix_close
    check_op: ">="
    check_value: 2000000
    if_false: "T5(락업 67주) 사용 검토 구간 진입 — 단 2027-02-11 이전 매도 시 마크업 8,791,650원 소멸"

# ── Critical Decision Point ─────────────────────────────────────
# 계획을 '조정'하는 게 아니라 '뒤집어야' 하는 조건. 발동하면 그날 브리핑
# 최상단에 경고가 뜨고, 사장님 판단을 요구한다. 자동으로 매도하지 않는다.
critical_decision_points:
  - id: CDP1
    name: "하이닉스 가격 붕괴"
    severity: critical
    check_key: hynix_close
    check_op: "<="
    check_value: 1400000
    action: >
      1.29억 조달에 92주 이상이 필요해진다(계획 71주 대비 +21주).
      선택지: ①목표 조달액 하향(월세 일부를 현금 소진으로 충당)
      ②잔여 보유 목표 포기 ③전세 재계약 검토. 셋 다 사장님 판단 사항이다.

  - id: CDP2
    name: "금리 급락 — 인컴 수익률 가정 붕괴"
    severity: critical
    check_key: us_10y
    check_op: "<="
    check_value: 4.0
    action: >
      명목 5.5% 가정이 무너지면 같은 월세에 더 큰 원금이 필요하다.
      목표 조달액 128,652,000원을 재계산해야 한다 — 이 계획 전체의 분모가 바뀐다.

  - id: CDP3
    name: "변동성 급등"
    severity: warning
    check_key: us_vix
    check_op: ">="
    check_value: 35
    action: >
      진행 중인 tranche 실행을 일시 보류하고 유동성을 우선한다.
      단 T1(mandatory)은 보류 대상이 아니다 — 실행 리스크가 더 크다.

  - id: CDP4
    name: "원화 급락"
    severity: warning
    check_key: kr_usdkrw
    check_op: ">="
    check_value: 1500
    action: "해외형 커버드콜 배제 논거 재검토. 달러 인컴 자산 편입을 다시 계산한다."

  - id: CDP5
    name: "하이닉스 급등 — 조기 완료 기회"
    severity: opportunity
    check_key: hynix_close
    check_op: ">="
    check_value: 2400000
    action: >
      1.29억을 54주로 조달 가능(계획 71주 대비 17주 절약).
      잔여 tranche를 앞당겨 일괄 실행하고 잔여 보유를 195주로 늘리는 것을 검토한다.

  - id: CDP6
    name: "신용 스프레드 확대 — 위험자산 전반 경계"
    severity: warning
    check_key: us_hy_oas
    check_op: ">="
    check_value: 5.0
    action: >
      고배당·커버드콜 포함 위험자산 전반의 분배 지속성을 재점검한다.
      인컴 포트폴리오 구축 시점(2027-02-20)을 늦추는 것도 선택지다.
