# 병목 이동 추적 — 다음 병목 섹터 선제 매수 단계 전략 (2026-09-24 신설)
#
# 사용자 요청(2026-09-24): "내년 4월에 하이닉스 자사주를 또(5천만원 넘게)
# 받게 될 것인데, 전력이 다음 병목이 된다면 현재 병목이 해소되면서
# 하이닉스 주가가 상당 떨어질 수 있다 … 리스크 관리 차원에서 다음 병목에
# 지금 시점에 매수해 놓는 것이 좋겠다. 이것을 모니터링하고, 다음 병목이
# 확정되기 전에 해당 섹터의 대장주나 ETF를 매수하는 전략을 단계별로
# 구성하여 트레이스를 통해 … 리포트에서 제안될 수 있도록 해줘."
#
# 판정 엔진: engine/bottleneck/rotation.py — 판정만 한다(자동 매수 없음).
# 개념·근거: wiki/concepts/ai-bottleneck-rotation-map.md
#
# ⚠ R4: 하이닉스 자체의 BUY/HOLD/SELL 지시는 engine/exporters/sk_hynix_decision.py
# 단일 출처다. 이 파일은 "다른 섹터를 얼마나 사 둘지"만 다루며 하이닉스
# 매도를 지시하지 않는다.

meta:
  anchor_date: "2027-04-01"   # 사용자 표현 "내년 4월" — 정확한 지급일 확인되면 교체
  anchor_label: "하이닉스 자사주(PS) 추가 수령 — 5천만원+"
  # 잠정값 — 2026-09-24 사용자: "예산과 매수 비율은 진행되면서 정하기로".
  # 4월 추가 수령분(5천만원+)의 약 절반을 상한으로
  # 잡았다. 헤지는 "하이닉스가 떨어지는 시나리오"의 보험이지 주력 베팅이
  # 아니므로 신규 노출 전액(1:1)까지 가지 않는다.
  hedge_budget_krw: 25000000
  budget_confirmed: false
  # 주가 신호(상대강도·이평)는 오늘과 이 일수 전 둘 다 성립해야 인정한다 —
  # 하루 이틀 튀는 걸로 단계를 올리지 않기 위한 지속성 조건.
  persistence_days: 7
  # 펀더멘털 최신 분기가 이 일수보다 오래되면 그 종목은 판정에서 뺀다(R3).
  fundamental_stale_days: 200
  # 주가 최신일이 이 일수보다 오래되면 그 종목 주가 신호는 판정 불가.
  price_stale_days: 7

# 현재 병목(B0). 아래 신호가 켜질수록 "현재 병목이 풀리는 중" → 헤지 단계
# 승격을 허용한다. 사용자가 걱정한 시나리오(병목 해소 → 하이닉스 하락)의
# 직접 증거들이다.
incumbent:
  id: B0
  name: "HBM — 메모리 대역폭"
  leader: {ticker: "000660.KS", name: "SK하이닉스"}
  signals:
