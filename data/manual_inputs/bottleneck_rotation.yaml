# 단계 — 누적 목표 비중(해당 후보 예산 대비 %). 헤지 후보(role: hedge)는
# min_incumbent(현재 병목 약화 신호 수)도 충족해야 한다. extension 후보는
# 현재 병목의 연장이라 min_incumbent를 보지 않는다.
stages:
  - stage: 1
    name: "정찰"
    min_score: 2
    require_both_kinds: true   # 펀더멘털 1개 + 주가 1개 이상 — 한쪽만으론 안 움직인다
    min_incumbent: 0
    cum_pct: 25
    instruments: "ETF만(없으면 대장주 1종목) — 틀려도 아프지 않은 크기"
  - stage: 2
    name: "구축"
    min_score: 3
    require_both_kinds: true
    min_incumbent: 1
    cum_pct: 60
    instruments: "ETF + 대장주 1~2종목"
  - stage: 3
    name: "확정"
    min_score: 4
    require_both_kinds: true
    min_incumbent: 2
    cum_pct: 100
    instruments: "ETF + 대장주 — 예산 상한까지"

# extension 후보(B2)가 이 단계 이상이면 헤지 후보는 이 단계를 넘지 못한다 —
# 메모리가 여전히 병목이면 "하이닉스 하락" 시나리오의 확률이 낮아지므로
# 헤지를 끝까지 채울 이유가 줄어든다.
extension_caps_hedge:
  when_extension_stage_at_least: 2
  hedge_max_stage: 2

# 철회 — 매수분이 있는데 후보 점수가 이 값 이하로 1주 지속되면 추가 매수를
# 멈추고 보유분을 재검토하라고 알린다(자동 매도 아님).
unwind:
  max_score: 1
