# 환율 국면 판단(FRS)의 지정학·위기 요인 입력 (Master Instruction 7.3 예외 정책).
#
# 전쟁·팬데믹·관세 같은 사건은 공개 API로 수치화할 수 없다. 코드가 계산할 수
# 없는 유일한 요인이라 **Claude가 뉴스를 조사해 채운다**(/ingest 흐름).
# semiconductor.yaml·data_center_construction.yaml과 동일한 스키마다 —
# 새 파이프라인을 만들지 않는다는 게 이 저장소의 원칙이다.
#
# 왜 이 요인이 필요한가 (wiki/concepts/usdkrw-below-ma36-episodes.md):
#   ① 2010 국면을 끝낸 건 미국 신용등급 강등 + 유럽 재정위기였다.
#   ⑥ 2026 국면의 배경엔 미-이란 무력충돌과 미국 관세가 있다.
# 둘 다 금리·환율 데이터엔 사후에야 나타난다.
#
# signals 값은 전부 0~1 위험도다(0 = 위험 없음, 1 = 극단).
# ⚠ **부호에 주의** — 위험이 높을수록 안전자산(달러) 선호가 커져 **원화가
# 약해진다**. engine/fx/regime_score.py의 score_geopolitical()이 부호를
# 뒤집어 처리하므로 여기엔 "위험도"를 그대로 쓴다.
#
# 갱신 절차:
#   1. 뉴스 조사(WebSearch) → 아래 4개 축을 0~1로 평가
#   2. as_of를 조사한 날짜로 갱신 — 오래되면 리포트가 "N일 전 판단"이라고
#      표기한다(R2). 30일 넘게 방치하지 말 것.
#   3. notes에 근거를 남긴다. 숫자만 바꾸고 근거를 안 남기면 다음 세션이
#      왜 그 값인지 알 수 없어 검증도 갱신도 못 한다.
#   4. reliability_grade는 3을 넘기지 않는다(수동 입력 상한).

as_of: "2026-09-10"
reliability_grade: 3
signals:
  # ⚠ 0.55 → 0.80 상향 (2026-09-10 뉴스 조사 반영).
  # 최초 작성 때 보유 실측(FRED 브렌트 $96, 6개월 +1.8%)만 보고 "안정돼
  # 급성 국면은 아님"으로 판단했는데, **그 실측이 낡은 것이었다**.
  # 9/9 브렌트 11월물 100.07달러, WTI 94.73달러. 이란-미국 무력충돌
  # 격화(이란의 미 해군 전함 공격, 미국의 이란 유조선 타격), 후티 반군의
  # 사우디 남부 에너지 시설 공격, 호르무즈 해협 수송 차질로 우회 환적로마저
  # 위협받는 상황. 월가에서 120~150달러 경고까지 나온다.
  # 이 저장소의 FRED 유가 계열이 지연 반영되는 동안 수치는 조용히 낙관을
  # 유지한다 — 뉴스 축이 존재하는 이유가 정확히 이것이다.
  geopolitical_risk: 0.80
  pandemic_risk: 0.00       # 진행 중인 팬데믹 없음
  # 0.40 유지. 미 상무부가 반도체 관세를 검토 중이고 완제품(노트북 등)까지
  # 대상에 넣는 방안이 거론된다. 다만 ①한국 산업부가 "경쟁국 대비 불리하지
  # 않은 대우"를 확인받았다고 밝혔고 ②통상전문가들은 자국 기업 피해 때문에
  # 실제 부과 가능성을 낮게 본다. 위협은 실재하나 확정 사건이 아니라 유지.
  trade_policy_risk: 0.40
  # 0.10 유지. 하이일드 스프레드 2.67%p로 역사적 저점권, VIX 15.7.
  # 유가 급등에도 신용시장 스트레스 신호는 아직 없다 — 이 괴리 자체가
  # 다음 점검 포인트다(유가발 인플레 우려가 신용으로 번지는지).
  financial_stress: 0.10
notes: >
  2026-09-10 WebSearch 조사 반영(최초 작성본을 같은 날 상향 수정).
  최초엔 보유 실측만 보고 geopolitical_risk를 0.55로 잡았으나, 조사 결과
  중동 상황이 실측보다 훨씬 앞서가 있었다 — 브렌트가 이미 100달러를
  넘겼는데 저장소의 FRED 계열은 $96에 머물러 있었다. 0.80으로 상향.
  이 값이면 종료 트리거 '지정학 급등(2011형)'의 임계 0.70을 넘겨 경고가
  켜지고, trigger_kind는 NON_US_SHOCK으로 분류된다(안전자산 선호는 미국
  긴축과 반대로 금리를 끌어내리므로 장기채 함의가 정반대다 —
  wiki/concepts/fx-episode-dollar-assets.md §4).
  ⚠ 원문 대조는 못 했다(뉴스 도메인 WebFetch egress 차단). WebSearch
  스니펫 종합이라 [미검증] 비중이 있고, 사건이 진정되면 즉시 낮춰야 한다.
sources:
  - "WebSearch 2026-09-10 '중동 정세 긴장 유가' — 파이낸셜뉴스·이데일리(브렌트 100.07달러, 사우디 에너지시설 피격, 호르무즈 우회로 위협)"
  - "WebSearch 2026-09-10 '미국 관세 반도체 수출규제 한국' — 아시아경제·뉴시스(러트닉 상무장관 반도체 관세 검토, 한국 산업부 '불리하지 않은 대우' 확인)"
  - "sources/macro-series.csv — us_brent, us_vix, us_hy_oas (실측. 유가는 뉴스 대비 지연 반영 중)"
  - "wiki/concepts/usdkrw-below-ma36-episodes.md — ⑥국면 배경 서술"
