name: SEC EDGAR Hyperscaler CapEx

# 2026-08-05 신설, 2026-08-06 수정 (automation-vs-ai-narrative-roadmap.md
# "2단계") — 최초 raw:true 실행에서 4개사 전부 403("Undeclared Automated
# Tool") 확인: data.sec.gov는 API 키는 불필요하지만 User-Agent에 실제
# 이메일이 포함된 "이름 email@domain.com" 형식을 요구한다(없으면 봇으로
# 판정해 차단). 별도 SEC_EDGAR_CONTACT 시크릿을 새로 만드는 대신 이미 등록된
# GMAIL_ADDRESS 시크릿(daily-brief-report.yml 등에서 발신 메일 계정으로 이미
# 사용 중)을 재사용 — 사용자 제안(2026-08-06)으로 시크릿 중복 생성 방지.

on:
  workflow_dispatch:
    inputs:
      raw:
        description: "true로 주면 --raw 진단 모드(CSV 저장 안 함, 필드명 검증용)"
        required: false
        default: "false"
      company:
        description: "특정 회사만(GOOGL/MSFT/AMZN/META), 비우면 4개 전부"
        required: false
        default: ""
  schedule:
    # 분기 실적 발표는 부정기적이라 일 단위로 확인할 필요는 없음 — 매주
    # 월요일 21:00 UTC(화요일 06:00 KST)에 한 번, 새 10-Q가 올라왔으면 반영.
    - cron: "0 21 * * 1"

permissions:
  contents: write

jobs:
  fetch-capex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch (raw diagnostic mode)
        if: ${{ github.event.inputs.raw == 'true' }}
        env:
          SEC_EDGAR_CONTACT: "PEOS-research ${{ secrets.GMAIL_ADDRESS }}"
        run: |
          if [ -n "${{ github.event.inputs.company }}" ]; then
            python3 scripts/sec_edgar_capex.py fetch --company "${{ github.event.inputs.company }}" --raw
          else
            python3 scripts/sec_edgar_capex.py fetch --raw
          fi

      - name: Fetch (normal mode, upsert CSV)
        if: ${{ github.event.inputs.raw != 'true' }}
        env:
          SEC_EDGAR_CONTACT: "PEOS-research ${{ secrets.GMAIL_ADDRESS }}"
        run: |
          if [ -n "${{ github.event.inputs.company }}" ]; then
            python3 scripts/sec_edgar_capex.py fetch --company "${{ github.event.inputs.company }}"
          else
            python3 scripts/sec_edgar_capex.py fetch
          fi
          python3 scripts/sec_edgar_capex.py show

      - name: Commit updated CapEx data
        if: ${{ github.event.inputs.raw != 'true' }}
        run: |
          git config user.name "peos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sources/hyperscaler-capex.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: SEC EDGAR hyperscaler capex update $(date -u +%Y-%m-%d)"
            git push
          fi
