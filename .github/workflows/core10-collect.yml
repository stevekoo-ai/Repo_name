name: Core-10 지표 수집 (KOSIS·ECOS·FRED)

# Core-10 collection previously ran only as a side effect of
# daily-peos-report.yml, which was removed from main on 2026-08-11 under the
# "remove push/email code" policy. That workflow did two jobs and only the
# publishing half was the reason for removal — since then nothing refreshes the
# Core-10 indicators, so every report carries them forward.
#
# This restores the collection half ONLY. It generates no report, sends no
# email, and pushes nothing but normalized series data — matching the six
# collection workflows that were kept, not the publishing ones that were not.

on:
  schedule:
    # 21:30 UTC = 06:30 KST — after macro-data-sync (22:10 UTC prev day) so the
    # two never contend for the same files.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      retry_until_fresh:
        description: >-
          true면 KOSIS·ECOS가 전부 성공할 때까지 10분 간격으로 재시도(최대
          약 5시간). 2026-08-15 KOSIS/ECOS가 GitHub Actions 러너에서 전부
          connect timeout(TCP 연결 자체가 안 열림 — 9시간 전 macro-data-sync는
          5초 만에 성공했던 것과 대조)이 나 일시적 장애로 판단, 복구를
          기다리는 수동 캠페인용. 매일 자동 실행(schedule)은 이 입력이 없어
          기본값 false로 빠르게 끝난다 — 일상 수집을 5시간짜리로 만들지 않음.
        type: boolean
        default: false

permissions:
  contents: write
  # Needed only for the self-escalation step below (dispatching this same
  # workflow again with retry_until_fresh=true) — that call goes through the
  # REST API with GITHUB_TOKEN, which requires this scope to create a
  # workflow_dispatch event.
  actions: write

concurrency:
  group: core10-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap a job at 360 minutes regardless of what's
    # requested here — set below that so a retry_until_fresh run that somehow
    # overruns gets killed by OUR limit with the freshness-audit/failure-alert
    # steps still reachable, rather than by GitHub's with no cleanup at all.
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Core-10 series (retry until fresh, if requested)
        id: collect
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          RETRY_UNTIL_FRESH: ${{ inputs.retry_until_fresh }}
        # Not --strict: one dead upstream should not stop the others from
        # landing. The freshness audit further down is what makes a failure
        # visible.
        #
        # retry_until_fresh=true loops collect+commit together so a series
        # that recovers on attempt N is saved immediately rather than waiting
        # for every series to succeed in the same attempt — KOSIS and ECOS
        # are independent outages and there is no reason a fix to one should
        # wait on the other.
        #
        # "10분 간격" means attempts START ~10 minutes apart, not that a
        # 10-minute sleep is added on top of however long the attempt itself
        # took — a fully-failing attempt already takes ~9 minutes (11 series
        # x up to 3 retries x connect timeout), observed directly in run
        # 31871454377. A flat +600s sleep on top would make the true cadence
        # ~19min and only fit ~17 attempts in the 6h job ceiling GitHub
        # enforces on hosted runners; timing the sleep from attempt START
        # keeps the cadence honest and fits a full 30 attempts (~5h) with an
        # hour of buffer for setup/install/the final freshness audit.
        run: |
          git config user.name "core10-collect-bot"
          git config user.email "actions@users.noreply.github.com"

          MAX_ATTEMPTS=1
          INTERVAL_SECONDS=600
          if [ "$RETRY_UNTIL_FRESH" = "true" ]; then
            MAX_ATTEMPTS=30
          fi

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            attempt_start=$(date +%s)
            echo "::group::attempt $i/$MAX_ATTEMPTS"
            python -m scripts.collect_core10 | tee /tmp/collect_out.txt
            echo "::endgroup::"

            git add data/normalized/ data/raw/ sources/ 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No new observations this attempt"
            else
              git commit -m "chore: core-10 collection $(date -u +%Y-%m-%dT%H:%M:%SZ) (attempt $i/$MAX_ATTEMPTS)"
              BRANCH="${GITHUB_REF_NAME:-main}"
              for r in 1 2 3 4 5; do
                git push && break
                echo "push rejected, rebasing onto latest $BRANCH (attempt $r)"
                git fetch origin "$BRANCH"
                git rebase "origin/$BRANCH"
                sleep $((r * 3))
              done
            fi

            # Stop once every kosis:/ecos: line in this attempt's own success
            # table reports OK — the freshness audit's day-based tolerances
            # are the wrong tool for "did THIS attempt succeed", since a
            # series can look fine there while still carrying forward.
            if ! grep -qE '^(kosis|ecos):.*❌' /tmp/collect_out.txt; then
              echo "KOSIS/ECOS 전부 성공 — 재시도 루프 종료"
              echo "still_failing=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              elapsed=$(( $(date +%s) - attempt_start ))
              remaining=$(( INTERVAL_SECONDS - elapsed ))
              if [ "$remaining" -gt 0 ]; then
                echo "일부 소스 실패 — 이번 시도 ${elapsed}초 소요, ${remaining}초 더 대기 후 재시도 ($((i+1))/$MAX_ATTEMPTS, 목표 간격 10분)"
                sleep "$remaining"
              else
                echo "일부 소스 실패 — 이번 시도가 이미 ${elapsed}초 걸려 목표 간격을 넘김, 대기 없이 바로 재시도 ($((i+1))/$MAX_ATTEMPTS)"
              fi
            else
              echo "::warning::재시도 상한(${MAX_ATTEMPTS}회, 약 5시간) 도달 — 일부 소스가 계속 실패 중"
            fi
          done

          # Reached only when the loop ran out of attempts without a clean
          # success table. Exit non-zero so the failure() steps below (the
          # self-escalation dispatch and the email alert) actually fire —
          # collect_core10.py itself always exits 0 (no --strict) and every
          # git command above can succeed even while KOSIS/ECOS stay down, so
          # without this the step reports green regardless of outcome.
          echo "still_failing=true" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Report data freshness
        # A job exiting 0 is not evidence that data arrived — three ECOS series
        # sat at 2018-08-24 for 2,912 days while every run reported success.
        # This measures the outcome instead, and annotates dead series so a
        # silent collector cannot pass as healthy. `if: always()` because this
        # must show current state even when the collect step above exits
        # non-zero — without it, a failed collection would skip straight past
        # the one step that shows what's actually stale.
        if: always()
        run: |
          python -m scripts.data_freshness_audit | tee /tmp/freshness.txt
          if grep -q "DEAD" /tmp/freshness.txt; then
            echo "::warning::일부 시리즈가 수집되지 않고 있습니다 — 위 DEAD 목록 확인"
          fi

      - name: Auto-escalate to a retry campaign
        # Self-sufficiency: once retry_until_fresh is proven out, a plain
        # daily run should not need a human to notice a KOSIS/ECOS outage and
        # manually re-dispatch with retry_until_fresh=true — it should do that
        # itself. Scoped to schedule-triggered runs only (github.event_name),
        # so a retry campaign that itself exhausts 30 attempts does NOT
        # re-dispatch another one — workflow_dispatch runs never hit this
        # condition, which is what breaks the chain.
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/core10-collect.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"retry_until_fresh":"true"}}'
          echo "재시도 캠페인(retry_until_fresh=true) 자동 시작함"

      - name: Report that collection failed
        # A collector that stops collecting looks exactly like one that has
        # nothing new to collect. Three ECOS series sat at 2018-08-24 for 2,912
        # days while every run reported success — so a failure here is mailed
        # rather than left in a log nobody opens.
        #
        # The message differs by context so the inbox distinguishes "handled
        # automatically, FYI" from "needs a human now": a schedule run that
        # just auto-escalated is not yet an emergency (the retry campaign
        # above is already running), but a retry campaign that itself
        # exhausted every attempt (~5h of real failures) is.
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            REASON="core10-collect 일일 자동 수집에서 KOSIS/ECOS 일부가 실패해 재시도 캠페인(최대 5시간, retry_until_fresh)을 자동 시작했습니다. 이 메일은 참고용이며, 캠페인이 그마저 실패하면 별도 메일이 옵니다."
          else
            REASON="core10-collect 재시도 캠페인이 최대 시도(30회, 약 5시간)를 전부 소진하고도 KOSIS/ECOS 일부가 계속 실패했습니다 — 지금은 자동 복구가 아니라 확인이 필요합니다."
          fi
          python -m scripts.send_report_email --failure-alert "$REASON"
