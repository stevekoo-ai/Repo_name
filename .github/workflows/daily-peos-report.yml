name: Daily PEOS Report

# TRACK A ONLY — 경제판단 리포트.
# 설계 근거: wiki/concepts/automation-strategy-and-delivery-boundary.md
#
# 이 워크플로가 다루는 것은 사용자의 거시·SK하이닉스·부동산 판단 리포트뿐이며,
# 사용자가 GitHub 업로드와 이메일 발송을 명시적으로 허용한 범위다(트랙 A).
# 회사 업무 산출물(트랙 B)은 이 워크플로에 절대 연결하지 않는다 — 2026-08-11에
# main을 새 뿌리로 재작성하면서까지 제거된 것들이고, 회사망 우회 경로
# (dispatch.sh / upload_brief.py 계열)는 다시 만들지 않는다.
#
# 이 워크플로의 성공은 "잡이 초록색"이 아니라 "리포트가 사용자에게 도착함"이다.
# 그래서 마지막 두 스텝이 존재한다: 커밋이 실제로 원격에 도달했는지 검증하고,
# 어느 단계에서든 실패하면 그 사실을 메일로 알린다. 08-08~10에 3일치 리포트가
# 사라진 것을 아무도 몰랐던 이유가 실패를 아무도 알리지 않았기 때문이다.

on:
  schedule:
    # 21:00 UTC = 06:00 KST (next day)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: "리포트 대상 월 (YYYY-MM). 비워두면 실행 시점의 이번 달."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-peos-report
  cancel-in-progress: false

jobs:
  run-peos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PEOS pipeline
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # 2026-09-01: gmail 자신 + COMPANY_EMAIL(회사 메일) 둘 다로 발송 —
          # core/notify.py의 EmailChannel이 콤마로 구분된 여러 수신자를
          # 분리해서 각각 sendmail()에 넘기도록 이미 수정됨. NOTIFY_EMAIL_TO
          # 시크릿을 따로 유지할 필요 없이 여기서 두 시크릿을 조합.
          NOTIFY_EMAIL_TO: ${{ secrets.GMAIL_ADDRESS }},${{ secrets.COMPANY_EMAIL }}
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            python -m engine.report.run --month "${{ github.event.inputs.month }}"
          else
            python -m engine.report.run
          fi

      - name: Regenerate PEOS Daily Dashboard
        run: python -m engine.report.daily_dashboard

      - name: Publish latest monthly report to Pages
        # report/ holds the <YYYY-MM>.html "latest" file, dated <YYYY-MM-DD>.html
        # archive copies, AND unrelated report families (subscription-desktop-*.html
        # etc.) that also live under report/. The old "not a dated-day file" filter
        # let subscription-desktop-2026-08-14.html sort after 2026-08.html and win
        # `tail -1` — docs/report.html would have published the wrong report. Match
        # the <YYYY-MM>.html shape explicitly instead of excluding by a different shape.
        run: |
          LATEST_MONTH_FILE=$(ls report/*.html | grep -E '/[0-9]{4}-[0-9]{2}\.html$' | sort | tail -1)
          cp "$LATEST_MONTH_FILE" docs/report.html

      # 2026-08-31 추가 — 사용자 요청 "모든 생성된 html이나 md file형태의
      # 보고서에 대해서, 여기에서 링크를 통해 확인할 수 있도록 해줘". .md는
      # GitHub이 자체 렌더링해주니 blob URL이면 충분하지만 .html은
      # docs/archive/에 미러링해야 Pages가 렌더링해서 보여준다 — 이 스크립트가
      # 그 미러링 + 링크 목록 페이지(docs/reports-index.html)를 매번 새로 만든다.
      - name: 리포트 링크 인덱스 갱신
        run: python3 scripts/build_reports_index.py

      - name: Commit updated report, history, and dashboard
        run: |
          git config user.name "peos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add report/ data/snapshots/ data/peos_daily_history.csv data/normalized/ data/daily_signals/ docs/peos-daily.html docs/report.html docs/archive/ docs/reports-index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily PEOS report $(date -u +%Y-%m-%d)"
            # A bare `git push` here silently discarded three consecutive days of
            # reports (runs #41-#43, 2026-08-08~10): the pipeline succeeded and
            # committed locally, then push was rejected as non-fast-forward because
            # main had advanced since checkout, and the job exited 1 with the work
            # thrown away. Same rebase-and-retry loop real-estate-sync.yml already
            # uses — generation was never the problem, delivery was.
            BRANCH="${GITHUB_REF_NAME:-main}"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected, rebasing onto latest $BRANCH (attempt $i)"
              git fetch origin "$BRANCH"
              git rebase "origin/$BRANCH"
              sleep $((i * 3))
            done
          fi

      - name: Fail loudly if the report never reached the repo
        # Three days of failures went unnoticed because nothing checks whether the
        # commit actually landed. If HEAD is not on origin/main, the run did not
        # deliver, and that must not look like success.
        run: |
          # Verify against the branch this run is actually on. Checking against
          # main unconditionally made every manual dispatch on a feature branch
          # fail even when the push succeeded (runs #44-#47, 2026-08-12).
          BRANCH="${GITHUB_REF_NAME:-main}"
          git fetch origin "$BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$BRANCH"; then
            echo "::error::daily PEOS report was generated but never pushed to $BRANCH — delivery failed"
            exit 1
          fi
          echo "report delivered: $(git rev-parse --short HEAD) is on origin/$BRANCH"

      - name: Email the report
        # The repo copy is the archive; this is the channel the user actually
        # reads. run.py already pushes a short text summary and swallows any
        # failure on purpose (generation must not die for SMTP), so the report
        # itself is sent here instead, where a failure is allowed to be loud.
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.GMAIL_ADDRESS }},${{ secrets.COMPANY_EMAIL }}
        run: python -m scripts.send_report_email

      - name: Report that the report did not arrive
        # Runs only when something above failed. Without this the failure mode
        # is silence, which is exactly how 2026-08-08~10 went unnoticed: the
        # user's only signal was the reports quietly stopping.
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.GMAIL_ADDRESS }},${{ secrets.COMPANY_EMAIL }}
        run: |
          python -m scripts.send_report_email \
            --failure-alert "daily-peos-report 워크플로가 실패했습니다 (생성·커밋·전달 중 한 단계)"
