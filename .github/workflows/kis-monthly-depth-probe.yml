name: KIS 월봉 깊이 프로브 (임시)

# 2026-08-17 임시 진단용 — "월단위 장기간 그래프"를 위해 --months를 24보다
# 훨씬 크게(예: 90, 2019년부터) 요청했을 때 KIS API가 실제로 그만큼의 행을
# 돌려주는지(월봉 조회는 보통 1회 호출당 최대 100행 캡이 있다는 문서 기억을
# 검증) 확인한다. 확인되면 이 파일은 삭제한다(customs-trade-api-probe.yml,
# kis-index-monthly-probe.yml과 동일 패턴).

on:
  push:
    paths:
      - ".github/workflows/kis-monthly-depth-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: KOSPI 월봉 90개월 요청 (raw)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python3 scripts/investor_flow.py monthly-history --code 0001 --is-index \
            --months 90 --raw > /tmp/raw.json
          python3 -c "
import json
d = json.load(open('/tmp/raw.json'))
rows = d.get('output2') or []
print('row count:', len(rows))
if rows:
    dates = sorted(r['stck_bsop_date'] for r in rows if r.get('stck_bsop_date'))
    print('earliest:', dates[0] if dates else None)
    print('latest:', dates[-1] if dates else None)
"
