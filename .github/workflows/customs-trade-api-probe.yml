name: 관세청 Newtrade(수출입총괄 GW) API 확인

# 2026-08-17 — 사용자가 정확한 base_url을 확인해줬다: apis.data.go.kr/1220000/Newtrade
# (기존 자동 인증키, XML 응답). 직전 라운드(10개 후보, 다른 이름들)는 전부
# 연결 타임아웃이었다 — data.go.kr 게이트웨이 자체가 이 러너에서 일시적으로
# 불안정했을 가능성이 있어, 이번엔 후보를 최소(오퍼레이션명 2개)로 줄여서
# 부하를 최소화한다. 성공하면 collectors/에 정식 코드로 옮기고 이 파일은
# 삭제한다.
#
# push 트리거 — workflow_dispatch는 파일이 default 브랜치에 있어야 API로
# 발동 가능하므로, subscription-schema-probe.yml과 동일하게 push로 즉시 실행.

on:
  push:
    branches:
      - claude/ai-agent-impl-002tip
    paths:
      - .github/workflows/customs-trade-api-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: getNewtradeList 최대 이력 범위 확인
        env:
          SERVICE_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set +e
          url="https://apis.data.go.kr/1220000/Newtrade/getNewtradeList"
          echo "=== 1988-01 ~ 2026-07, numOfRows=600 ==="
          code=$(curl -sS -G "$url" \
            --data-urlencode "serviceKey=${SERVICE_KEY}" \
            --data-urlencode "strtYymm=198801" \
            --data-urlencode "endYymm=202607" \
            --data-urlencode "numOfRows=600" \
            --data-urlencode "pageNo=1" \
            -o resp_full.xml -w "%{http_code}" --max-time 25 --connect-timeout 10)
          echo "HTTP status: $code"
          echo "byte size: $(wc -c < resp_full.xml)"
          echo "--- resultCode/resultMsg ---"
          grep -o '<resultCode>[^<]*</resultCode>\|<resultMsg>[^<]*</resultMsg>\|<totalCount>[^<]*</totalCount>' resp_full.xml
          echo "--- first 3 <year> values ---"
          grep -o '<year>[^<]*</year>' resp_full.xml | head -3
          echo "--- last 5 <year> values ---"
          grep -o '<year>[^<]*</year>' resp_full.xml | tail -5
          echo "--- total <year> count ---"
          grep -o '<year>[^<]*</year>' resp_full.xml | wc -l
