name: 관세청 수출입총괄(GW) API 엔드포인트 probe

# 2026-08-16 신설 — 사용자 요청("수출입동향과 코스피 관계를 가장 길고 오래된
# 데이터로"). 산업부 보도자료 기반 WebSearch로 과거 월별 수치를 하나씩
# 복원하는 방식은 이미 4개월분에서 검증 난이도가 급격히 올라가는 걸 확인했다
# (log 참고). 사용자가 지목한 data.go.kr "산업통상부_수출입동향 정보"
# (3039964, fileData형)는 이 세션의 프록시가 www.data.go.kr 자체를 막고 있어
# 직접 열어볼 수 없었지만, 같은 수치를 제공하는 관세청 OpenAPI 계열 상품
# "수출입총괄(GW)"(data ID 15102108, org 1220000)가 WebSearch로 확인됐다 —
# 다만 실제 서비스ID/오퍼레이션명은 Swagger 문서를 직접 열어야 확정되는데
# 그것도 이 세션에선 불가능하다. collectors/molit.py의 base_url 확정 방식과
# 동일하게, 후보 엔드포인트 여러 개를 실제로 두드려보고 로그로 정답을
# 확인하는 probe다(kosis_lookup.py와 같은 패턴).
#
# push 트리거를 쓰는 이유: workflow_dispatch는 워크플로 파일이 default
# 브랜치에 있어야 API로 발동 가능한데, 이 파일은 아직 이 브랜치에만 있다 —
# subscription-schema-probe.yml과 동일하게 push 이벤트로 즉시 실행되게 한다.
#
# 결과 확인 후 이 파일은 삭제하고 collectors/에 정식 코드로 옮긴다(probe
# 자체는 일회성 진단 도구, 커밋 이력에는 남지만 워크플로 목록에는 남기지 않음).

on:
  push:
    branches:
      - claude/ai-agent-impl-002tip
    paths:
      - .github/workflows/customs-trade-api-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 후보 엔드포인트 순차 호출 (수출입총괄 GW)
        env:
          SERVICE_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set +e
          declare -a CANDIDATES=(
            "http://apis.data.go.kr/1220000/nitemtrade/getNitemtradeList"
            "http://apis.data.go.kr/1220000/expImp/getExpImpList"
            "http://apis.data.go.kr/1220000/expImpTot/getExpImpTotList"
            "http://apis.data.go.kr/1220000/sumtrade/getSumtradeList"
            "http://apis.data.go.kr/1220000/gwtrade/getGwtradeList"
            "http://apis.data.go.kr/1220000/itemtrade/getItemtradeList"
            "http://apis.data.go.kr/1220000/natntrade/getNatntradeList"
            "http://apis.data.go.kr/1220000/cntrytrade/getCntrytradeList"
            "http://apis.data.go.kr/1220000/tradeSumry/getTradeSumryList"
            "http://apis.data.go.kr/1220000/expImpSumry/getExpImpSumryList"
          )
          for url in "${CANDIDATES[@]}"; do
            echo "=================================================="
            echo "=== $url ==="
            echo "=================================================="
            code=$(curl -sS -G "$url" \
              --data-urlencode "serviceKey=${SERVICE_KEY}" \
              --data-urlencode "strtYymm=202601" \
              --data-urlencode "endYymm=202607" \
              --data-urlencode "type=json" \
              --data-urlencode "numOfRows=20" \
              --data-urlencode "pageNo=1" \
              -o resp.json -w "%{http_code}" --max-time 15)
            echo "HTTP status: $code"
            echo "--- body (first 1500 chars) ---"
            head -c 1500 resp.json
            echo ""
            echo ""
          done

      - name: 원본 fileData 다운로드 API 시도 (참고용, 성공하면 더 좋음)
        env:
          SERVICE_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set +e
          echo "=== PublicDataDownloadService (fileData 3039964) ==="
          code=$(curl -sS -G "https://api.data.go.kr/openapi/service/rest/PublicDataDownloadService/getPublicDataFile" \
            --data-urlencode "serviceKey=${SERVICE_KEY}" \
            --data-urlencode "publicDataPk=3039964" \
            --data-urlencode "type=json" \
            -o resp2.json -w "%{http_code}" --max-time 15)
          echo "HTTP status: $code"
          head -c 1500 resp2.json
          echo ""
