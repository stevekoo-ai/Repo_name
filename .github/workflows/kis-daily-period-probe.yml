name: KIS 일봉 프로브 (임시)

# 2026-08-17 임시 진단용 — kis_fetch_price_history(period="D")가 실제로
# 동작하는지(필드명은 월봉과 같은 MONTHLY_PRICE_FIELDS/MONTHLY_INDEX_PRICE_FIELDS
# 재사용을 가정했다 — 미검증), 1회 호출당 며칠치가 돌아오는지(월봉은 최근
# ~50개월로 잘리는 게 실측됨 — 일봉도 비슷한 절단이 있는지) 확인한다.
# 확인되면 이 파일은 삭제한다(다른 probe workflow들과 동일 패턴).

on:
  push:
    paths:
      - ".github/workflows/kis-daily-period-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: SK하이닉스 일봉 200일 요청
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python3 -c "import datetime; from scripts.investor_flow import kis_fetch_price_history as f; end = datetime.date(2026,8,17); start = end - datetime.timedelta(days=200); rows = f('000660', is_index=False, period='D', start_date=start, end_date=end); print('row count:', len(rows)); print('first 3:', rows[:3]); print('last 3:', rows[-3:])"

      - name: 코스피 일봉 200일 요청
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python3 -c "import datetime; from scripts.investor_flow import kis_fetch_price_history as f; end = datetime.date(2026,8,17); start = end - datetime.timedelta(days=200); rows = f('0001', is_index=True, period='D', start_date=start, end_date=end); print('row count:', len(rows)); print('first 3:', rows[:3]); print('last 3:', rows[-3:])"
