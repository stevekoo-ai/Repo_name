name: Daily Brief Dispatch Sender

# 헤드리스 Claude 자율 사이클의 수신 leg (C1).
# 회사망 dispatch.sh가 보낸 repository_dispatch 이벤트를 수신해
# client_payload.html_b64(gzip+base64)를 복원 → 이메일 발송.
#
# 트리거: dispatch.sh 의 POST /repos/{owner}/{repo}/dispatches
#   event_type: send-brief
#   client_payload: { date, html_b64, encoding: "gzip+base64" }
#
# 설계 문서: wiki/concepts/headless-claude-autonomous-cycle.md
#           wiki/concepts/large-file-upload-bypass-ideas.md (안 1)

on:
  repository_dispatch:
    types: [send-brief]

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore HTML from client_payload (gzip+base64)
        id: restore
        shell: bash
        env:
          HTML_B64: ${{ github.event.client_payload.html_b64 }}
          DATE: ${{ github.event.client_payload.date }}
          ENCODING: ${{ github.event.client_payload.encoding }}
        run: |
          set -e
          # 파일명: report/daily-brief-<date>.html (기존 워크플로우와 동일 경로 규칙)
          DATE="${DATE:-unknown}"
          FILE="report/daily-brief-${DATE}.html"
          mkdir -p report
          # base64 디코딩 → gunzip → HTML 파일
          if [ "$ENCODING" = "gzip+base64" ]; then
            printf '%s' "$HTML_B64" | base64 -d | gunzip > "$FILE"
          else
            # 폴백: 순수 base64 (압축 없음) — 호환성
            printf '%s' "$HTML_B64" | base64 -d > "$FILE"
          fi
          SIZE=$(wc -c < "$FILE")
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "복원 완료: $FILE ($SIZE bytes)"

      - name: Send email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[Daily Brief] ${{ steps.restore.outputs.date }}"
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: Daily Brief Bot
          html_body: file://${{ steps.restore.outputs.file }}
          attachments: ${{ steps.restore.outputs.file }}
