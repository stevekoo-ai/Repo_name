name: 거시지표 자동 수집 (금리·GDP·환율)

on:
  schedule:
    - cron: "10 22 * * *"  # 07:10 KST, 매일 1회 — 금리/GDP는 하루 여러 번 바뀔 이유가 없음
  workflow_dispatch:       # 수동 실행(테스트용 + 일회성 장기 백필)
    inputs:
      backfill_series:
        description: "[선택] 장기 백필할 프리셋. 쉼표로 여러 개 가능 (예: us_nasdaq,us_2y). 비우면 평소대로 전체 sync"
        required: false
        default: ""
      backfill_start:
        description: "[선택] 백필 시작일 YYYY-MM-DD (FRED 기준). backfill_series와 함께 사용"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: macro-data-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 2026-08-21 추가 — 실패하면 성공할 때까지(최대 6시간, 10분 간격) 재시도.
      # 2026-09-09 추가 — 36개월 이동평균 분석에 2010년 이전 데이터가 필요했는데
      # sync는 DEFAULT_LOOKBACK_DAYS(10년)로 고정이라 장기 이력을 못 가져왔다.
      # macro_data.py fetch --start는 원래 있던 기능이고, upsert가 (series,date)
      # 키 기반 멱등 병합이라 기존 행을 깨지 않는다 — 워크플로에서 그 기능에
      # 닿을 입력만 없었을 뿐이라 통로만 뚫는다.
      - name: 일회성 장기 백필 (backfill_series 지정 시에만)
        if: ${{ github.event.inputs.backfill_series != '' }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          # 2026-09-10 — 한 번에 여러 계열을 백필할 수 있게 쉼표 구분 지원.
          # 계열마다 별도 프로세스로 돌리고 실패해도 다음 계열로 넘어간다:
          # 새로 추가하는 FRED series_id 중엔 아직 실측 검증이 안 된 것이
          # 섞여 있어(PRESETS의 "⚠ 미검증" 표기), 하나가 틀렸다고 나머지
          # 9개까지 못 받으면 왕복만 늘어난다. 어느 게 실패했는지는 마지막에
          # 모아서 명시하고, 전부 실패한 경우에만 잡을 실패시킨다.
          START_OPT=""
          if [ -n "${{ github.event.inputs.backfill_start }}" ]; then
            START_OPT="--start ${{ github.event.inputs.backfill_start }}"
          fi
          ok=""; failed=""
          IFS=',' read -ra SERIES <<< "${{ github.event.inputs.backfill_series }}"
          for raw in "${SERIES[@]}"; do
            name="$(echo "$raw" | tr -d '[:space:]')"
            [ -z "$name" ] && continue
            echo "::group::백필 $name"
            if python3 scripts/macro_data.py fetch --save --series "$name" $START_OPT; then
              ok="$ok $name"
            else
              echo "::warning::백필 실패 — $name (series_id 오류 가능성, PRESETS 확인 필요)"
              failed="$failed $name"
            fi
            echo "::endgroup::"
          done
          echo "성공:${ok:- 없음}"
          echo "실패:${failed:- 없음}"
          if [ -z "$ok" ]; then
            echo "::error::지정한 계열을 하나도 백필하지 못했습니다"
            exit 1
          fi

      - name: 프리셋 전체 동기화
        if: ${{ github.event.inputs.backfill_series == '' }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          attempt=1; max_attempts=36
          until python3 scripts/macro_data.py sync; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::${max_attempts}회(6시간) 재시도했지만 거시지표 동기화 실패"
              python3 scripts/log_automation_run.py macro-data-sync macro_sync "$attempt" "$max_attempts" exhausted
              exit 1
            fi
            echo "[재시도 $attempt/$max_attempts] 거시지표 동기화 실패 — 10분 후 재시도"
            attempt=$((attempt + 1))
            sleep 600
          done
          python3 scripts/log_automation_run.py macro-data-sync macro_sync "$attempt" "$max_attempts" success

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "macro-data-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sources/macro-series.csv
          [ -f sources/automation-run-log.csv ] && git add sources/automation-run-log.csv
          git diff --cached --quiet || git commit -m "거시지표 자동 동기화: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected, rebasing onto latest main (attempt $i)"
            git fetch origin main
            git rebase --autostash origin/main
            sleep $((i * 3))
          done

      # 2026-08-27 추가 — 재시도 소진으로 잡이 실패하면 위 커밋 스텝 자체가
      # 실행되지 않아 "exhausted" 로그 행이 영영 안 남는다 — 항상 실행되는
      # 별도 스텝으로 로그 파일만 커밋(성공 경로에선 위에서 이미 커밋돼
      # no-op).
      - name: 자동화 상태로그 커밋 (항상 실행)
        if: always()
        run: |
          git config user.name "macro-data-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f sources/automation-run-log.csv ]; then
            git add sources/automation-run-log.csv
            if git diff --cached --quiet; then
              echo "automation-run-log.csv: 새로 커밋할 행 없음"
            else
              git commit -m "chore: automation run log $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              for i in 1 2 3 4 5; do
                git push && break
                echo "push rejected, rebasing onto latest main (attempt $i)"
                git fetch origin main
                git rebase --autostash origin/main
                sleep $((i * 3))
              done
            fi
          fi

      # 2026-08-21 추가 — 위 재시도(최대 6시간)까지 다 소진하고도 실패한
      # 경우에만 도달. 트랙 A(거시지표, 경제판단 리포트 재료) 채널.
      - name: 실패 시 알림 (조용한 실패 방지)
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          python3 -m scripts.send_report_email \
            --failure-alert "macro-data-sync 워크플로가 실패했습니다 (6시간 재시도 소진) — 오늘의 거시지표(금리·GDP·환율)는 갱신되지 않았습니다."
