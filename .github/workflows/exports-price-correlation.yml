name: 수출입동향 × 주가 상관관계 갱신

# 사용자 요청(2026-08-15): 수출입동향(총수출/반도체수출 %YoY)과 SK하이닉스
# 주가·코스피 지수 간 상관관계를 표+그래프로 자동 생성.
#
# 두 단계로 구성:
#   1. scripts.investor_flow monthly-history — KIS 월봉을 sources/
#      monthly-price-history.csv에 채운다(portfolio-holdings-sync·
#      sk-hynix-daily-report와 같은 KIS_APP_KEY 공유이므로 토큰 캐시
#      패턴도 동일하게 재사용 — 동시 재발급 403 충돌 방지, 그 워크플로들의
#      2026-07-31 주석 참고).
#   2. scripts.correlation_analysis — 위 파일 + data/normalized/motie_*.csv를
#      읽어 monitoring/exports-price-correlation.{md,png} 생성.
#
# 수출입동향 자체는 data/manual_inputs/exports.yaml(월 1회 수동 갱신, MOTIE에
# 안정적 공개 API 없음)에서 오므로 이 워크플로가 그 파일을 건드리지는 않는다
# — 가격 이력만 자동 수집하고, 상관관계는 그 둘을 합쳐 매번 재계산한다.

on:
  schedule:
    # 10:30 UTC = 19:30 KST — portfolio-holdings-sync(19:10 KST) 직후,
    # 같은 KIS 토큰 캐시를 그날 이미 발급된 것으로 재사용할 수 있는 시점.
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exports-price-correlation
  cancel-in-progress: false

jobs:
  correlate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: KIS 토큰 캐시 날짜 계산
        id: kisdate
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: KIS 토큰 캐시 복원
        uses: actions/cache@v4
        with:
          path: scripts/.kis_token_cache.json
          key: kis-token-cache-${{ steps.kisdate.outputs.date }}
          restore-keys: |
            kis-token-cache-

      - name: SK하이닉스 월봉 수집
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        # KIS TR/필드명이 문서 기억 기반이라 최초 실행에서 실패할 수 있다 —
        # || true로 코스피 수집과 상관관계 계산까지는 계속 진행되게 하되,
        # 실패 자체는 로그에 그대로 남긴다(조용히 삼키지 않음).
        run: |
          python3 scripts/investor_flow.py monthly-history --code 000660 \
            --label "SK하이닉스" --months 24 || echo "::warning::SK하이닉스 월봉 수집 실패 — 위 에러 로그 확인"

      - name: 코스피 월봉 수집
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python3 scripts/investor_flow.py monthly-history --code 0001 --is-index \
            --months 24 || echo "::warning::코스피 월봉 수집 실패 — 위 에러 로그 확인"

      - name: 상관관계 재계산
        run: python -m scripts.correlation_analysis

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "exports-price-correlation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sources/monthly-price-history.csv data/raw/ monitoring/exports-price-correlation.md monitoring/exports-price-correlation.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: 수출입동향-주가 상관관계 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            BRANCH="${GITHUB_REF_NAME:-main}"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected, rebasing onto latest $BRANCH (attempt $i)"
              git fetch origin "$BRANCH"
              git rebase "origin/$BRANCH"
              sleep $((i * 3))
            done
          fi
