name: KIS 지수(코스피) 월봉 응답 구조 확인

# 2026-08-17 — investor_flow.py monthly-history --code 0001 --is-index가
# "API 응답에서 월봉 리스트(output2)를 찾지 못했습니다" 로 실패(방금 실측
# 확인). 종목(000660)과 같은 엔드포인트/TR로 시도했는데 지수는 응답 구조가
# 다를 가능성이 크다(코드 자체 주석에 이미 그렇게 적혀 있었음) — --raw로
# 실제 응답을 한 번 봐야 정확한 필드/엔드포인트를 고칠 수 있다. 진단
# 끝나면 삭제.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kis-index-monthly-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: KIS 토큰 캐시 날짜 계산
        id: kisdate
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: KIS 토큰 캐시 복원
        uses: actions/cache@v4
        with:
          path: scripts/.kis_token_cache.json
          key: kis-token-cache-${{ steps.kisdate.outputs.date }}
          restore-keys: |
            kis-token-cache-

      - name: 코스피 월봉 raw 응답 확인
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python3 scripts/investor_flow.py monthly-history --code 0001 --is-index --months 3 --raw
