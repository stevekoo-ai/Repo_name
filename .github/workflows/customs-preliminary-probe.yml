name: 관세청 잠정치 페이지 구조 프로브 (임시)

# 2026-08-17 사용자 요청 — 8/21에 나올 1~20일 잠정치가 자동으로 갱신되게
# 만들어달라는 요청 진행 중. 이 인터랙티브 세션의 WebFetch는
# customs.go.kr/korea.kr 등이 전부 EGRESS_BLOCKED라 실제 페이지 구조를
# 직접 못 봤다 — GitHub Actions 러너는 인터넷 제약이 다를 수 있어(다른
# 워크플로들이 이미 여러 외부 API를 문제없이 호출 중), 여기서 실제로
# 접근되는지/구조가 어떤지 먼저 확인한다. 확인되면 이 파일은 삭제한다
# (다른 probe workflow들과 동일 패턴).
#
# 2026-08-17: 이전 커밋에서 python3 -c의 멀티라인 문자열이 run: | 블록
# 스칼라 최소 들여쓰기 규칙을 어겨 YAML 파싱 자체가 실패했다(job 0개로
# 즉시 실패 — kis-monthly-depth-probe.yml에서 이미 한 번 겪은 것과 같은
# 실수). 별도 .py 스크립트 파일로 분리해 재발 방지.

on:
  push:
    paths:
      - ".github/workflows/customs-preliminary-probe.yml"
      - "scripts/_probe_customs_page.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: 목록/상세 페이지 접근 확인
        run: python3 scripts/_probe_customs_page.py
