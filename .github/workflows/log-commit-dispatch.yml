name: Log Commit Dispatcher

# 회사망에서 log.md(113KB, 73KB 한계 초과)를 push할 수 없을 때,
# gzip+base64+repository_dispatch로 Actions runner에 위임해 commit+push.
# Actions runner는 GitHub 인프라에서 실행되므로 회사망 POST 제약 없음.
#
# 트리거: dispatch_log.py 의 POST /repos/{owner}/{repo}/dispatches
#   event_type: commit-log
#   client_payload:
#     file_path:  "wiki/log.md"            # 원격 커밋 경로
#     content_b64: <gzip+base64 문자열>    # 파일 내용
#     encoding: "gzip+base64"
#     commit_message: <커밋 메시지>        # 멀티라인 가능
#     branch: "claude/ai-agent-impl-002tip" # 커밋 대상 브랜치
#
# 설계: wiki/concepts/headless-claude-autonomous-cycle.md
#       wiki/concepts/large-file-upload-bypass-ideas.md (안 1 gzip+dispatch 확장)

on:
  repository_dispatch:
    types: [commit-log]

jobs:
  commit-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch }}
          token: ${{ secrets.PAT_FOR_PUSH }}

      - name: Restore file from client_payload (gzip+base64) and commit
        env:
          CONTENT_B64: ${{ github.event.client_payload.content_b64 }}
          FILE_PATH: ${{ github.event.client_payload.file_path }}
          ENCODING: ${{ github.event.client_payload.encoding }}
          COMMIT_MESSAGE: ${{ github.event.client_payload.commit_message }}
        run: |
          set -e
          mkdir -p "$(dirname "$FILE_PATH")"
          # base64 디코딩 → gunzip → 파일
          if [ "$ENCODING" = "gzip+base64" ]; then
            printf '%s' "$CONTENT_B64" | base64 -d | gunzip > "$FILE_PATH"
          else
            printf '%s' "$CONTENT_B64" | base64 -d > "$FILE_PATH"
          fi
          SIZE=$(wc -c < "$FILE_PATH")
          echo "복원 완료: $FILE_PATH ($SIZE bytes)"

          # git config
          git config user.name "Log Commit Bot"
          git config user.email "noreply@anthropic.com"

          # commit + push (fast-forward; 다른 Agent가 먼저 push했으면 실패)
          git add "$FILE_PATH"
          git commit -m "$COMMIT_MESSAGE"
          git push
          echo "push 완료: $FILE_PATH"

      - name: Report
        if: always()
        run: |
          echo "::notice::log commit dispatch 완료 (또는 위 단계 에러 확인)"
