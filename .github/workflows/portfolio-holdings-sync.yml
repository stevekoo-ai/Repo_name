name: 포트폴리오 보유종목 자동 수집

on:
  schedule:
    - cron: "10 10 * * *"  # 19:10 KST, 장마감 후 1회
  workflow_dispatch: {}    # 수동 실행(테스트용)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 계좌별 보유종목 동기화
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_1: ${{ secrets.KIS_ACCOUNT_1 }}
          KIS_ACCOUNT_2: ${{ secrets.KIS_ACCOUNT_2 }}
          KIS_ACCOUNT_3: ${{ secrets.KIS_ACCOUNT_3 }}
          KIS_ACCOUNT_4: ${{ secrets.KIS_ACCOUNT_4 }}
        run: python3 scripts/portfolio_holdings.py sync

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "portfolio-holdings-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sources/portfolio-holdings.csv
          git diff --cached --quiet || git commit -m "포트폴리오 보유종목 자동 동기화: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
