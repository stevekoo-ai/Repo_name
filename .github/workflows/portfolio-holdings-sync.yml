name: 포트폴리오 보유종목 자동 수집

on:
  schedule:
    - cron: "10 10 * * *"  # 19:10 KST, 장마감 후 1회
  workflow_dispatch: {}    # 수동 실행(테스트용)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: KIS 토큰 캐시 날짜 계산
        id: kisdate
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # ⚠ 2026-07-31 추가 — sk-hynix-daily-report.yml과 같은 KIS_APP_KEY(GEN
      # 계좌)를 공유한다. 두 워크플로가 매번 새 OAuth 토큰을 발급받다가
      # 실행 시각이 몇십 초~몇 분 차이로 겹치면 KIS가 같은 appkey의 단시간
      # 재발급을 거부(403)해 이 워크플로가 2026-07-28~30 3일 연속 실패했다
      # — 원인은 sk-hynix-daily-report.yml의 19:00 KST 실행과 이 워크플로의
      # 19:10 KST 실행이 GitHub Actions 스케줄 지연으로 실제로는 45~90초
      # 간격까지 좁혀진 것. 토큰을 하루 동안 캐시에 저장해 공유하면 먼저
      # 도는 워크플로가 발급한 토큰을 나중 워크플로가 재사용해 충돌을 피한다.
      - name: KIS 토큰 캐시 복원
        uses: actions/cache@v4
        with:
          path: scripts/.kis_token_cache.json
          key: kis-token-cache-${{ steps.kisdate.outputs.date }}
          restore-keys: |
            kis-token-cache-

      - name: 계좌별 보유종목 동기화
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_APP_KEY_ISP: ${{ secrets.KIS_APP_KEY_ISP }}
          KIS_APP_SECRET_ISP: ${{ secrets.KIS_APP_SECRET_ISP }}
          KIS_APP_KEY_IRP: ${{ secrets.KIS_APP_KEY_IRP }}
          KIS_APP_SECRET_IRP: ${{ secrets.KIS_APP_SECRET_IRP }}
          KIS_ACCOUNT_GEN: ${{ secrets.KIS_ACCOUNT_GEN }}
          KIS_ACCOUNT_ISP: ${{ secrets.KIS_ACCOUNT_ISP }}
          KIS_ACCOUNT_DC: ${{ secrets.KIS_ACCOUNT_DC }}
          KIS_ACCOUNT_IRP: ${{ secrets.KIS_ACCOUNT_IRP }}
        run: python3 scripts/portfolio_holdings.py sync

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "portfolio-holdings-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sources/portfolio-holdings.csv
          git diff --cached --quiet || git commit -m "포트폴리오 보유종목 자동 동기화: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected, rebasing onto latest main (attempt $i)"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
