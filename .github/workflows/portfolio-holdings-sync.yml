name: 포트폴리오 보유종목 자동 수집

on:
  schedule:
    - cron: "10 10 * * *"  # 19:10 KST, 장마감 후 1회
  workflow_dispatch: {}    # 수동 실행(테스트용)

permissions:
  contents: write

# 2026-08-21 추가 — 재시도 창(최대 6시간)이 다음날 같은 시각 실행과 겹칠
# 일은 없지만(1일 1회), sk-hynix-daily-report.yml과 KIS_APP_KEY 토큰을
# 공유하므로 이 워크플로 자신과의 중복 실행만 직렬화.
concurrency:
  group: portfolio-holdings-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: KIS 토큰 캐시 날짜 계산
        id: kisdate
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # ⚠ 2026-07-31 추가 — sk-hynix-daily-report.yml과 같은 KIS_APP_KEY(GEN
      # 계좌)를 공유한다. 두 워크플로가 매번 새 OAuth 토큰을 발급받다가
      # 실행 시각이 몇십 초~몇 분 차이로 겹치면 KIS가 같은 appkey의 단시간
      # 재발급을 거부(403)해 이 워크플로가 2026-07-28~30 3일 연속 실패했다
      # — 원인은 sk-hynix-daily-report.yml의 19:00 KST 실행과 이 워크플로의
      # 19:10 KST 실행이 GitHub Actions 스케줄 지연으로 실제로는 45~90초
      # 간격까지 좁혀진 것. 토큰을 하루 동안 캐시에 저장해 공유하면 먼저
      # 도는 워크플로가 발급한 토큰을 나중 워크플로가 재사용해 충돌을 피한다.
      - name: KIS 토큰 캐시 복원
        uses: actions/cache@v4
        with:
          path: scripts/.kis_token_cache.json
          key: kis-token-cache-${{ steps.kisdate.outputs.date }}
          restore-keys: |
            kis-token-cache-

      # 2026-08-21 추가 — 실패하면 성공할 때까지(최대 6시간, 10분 간격) 재시도.
      - name: 계좌별 보유종목 동기화
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_APP_KEY_ISP: ${{ secrets.KIS_APP_KEY_ISP }}
          KIS_APP_SECRET_ISP: ${{ secrets.KIS_APP_SECRET_ISP }}
          KIS_APP_KEY_IRP: ${{ secrets.KIS_APP_KEY_IRP }}
          KIS_APP_SECRET_IRP: ${{ secrets.KIS_APP_SECRET_IRP }}
          KIS_ACCOUNT_GEN: ${{ secrets.KIS_ACCOUNT_GEN }}
          KIS_ACCOUNT_ISP: ${{ secrets.KIS_ACCOUNT_ISP }}
          KIS_ACCOUNT_DC: ${{ secrets.KIS_ACCOUNT_DC }}
          KIS_ACCOUNT_IRP: ${{ secrets.KIS_ACCOUNT_IRP }}
        run: |
          attempt=1; max_attempts=36
          until python3 scripts/portfolio_holdings.py sync; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::${max_attempts}회(6시간) 재시도했지만 보유종목 동기화 실패"
              python3 scripts/log_automation_run.py portfolio-holdings-sync holdings_sync "$attempt" "$max_attempts" exhausted
              exit 1
            fi
            echo "[재시도 $attempt/$max_attempts] 보유종목 동기화 실패 — 10분 후 재시도"
            attempt=$((attempt + 1))
            sleep 600
          done
          python3 scripts/log_automation_run.py portfolio-holdings-sync holdings_sync "$attempt" "$max_attempts" success

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "portfolio-holdings-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sources/portfolio-holdings.csv
          [ -f sources/automation-run-log.csv ] && git add sources/automation-run-log.csv
          git diff --cached --quiet || git commit -m "포트폴리오 보유종목 자동 동기화: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected, rebasing onto latest main (attempt $i)"
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done

      # 2026-08-27 추가 — 재시도 소진으로 잡이 실패하면 위 커밋 스텝 자체가
      # 실행되지 않아 "exhausted" 로그 행이 영영 안 남는다 — 항상 실행되는
      # 별도 스텝으로 로그 파일만 커밋(성공 경로에선 위에서 이미 커밋돼
      # no-op).
      - name: 자동화 상태로그 커밋 (항상 실행)
        if: always()
        run: |
          git config user.name "portfolio-holdings-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f sources/automation-run-log.csv ]; then
            git add sources/automation-run-log.csv
            if git diff --cached --quiet; then
              echo "automation-run-log.csv: 새로 커밋할 행 없음"
            else
              git commit -m "chore: automation run log $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              for i in 1 2 3 4 5; do
                git push && break
                echo "push rejected, rebasing onto latest main (attempt $i)"
                git fetch origin main
                git rebase origin/main
                sleep $((i * 3))
              done
            fi
          fi

      # 2026-08-21 추가 — 위 재시도(최대 6시간)까지 다 소진하고도 실패한
      # 경우에만 도달. 트랙 A(개인 포트폴리오) 채널이라 이메일 발송 허용.
      - name: 실패 시 알림 (조용한 실패 방지)
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          python3 -m scripts.send_report_email \
            --failure-alert "portfolio-holdings-sync 워크플로가 실패했습니다 (6시간 재시도 소진) — 오늘의 보유종목 데이터는 갱신되지 않았습니다."
