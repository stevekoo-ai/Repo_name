name: CXL Report Sender

# CXL 상품기획 보고서(경영진용 / Daily Update)가 repo에 push 되면
# 자동으로 Gmail로 발송. daily-brief-report.yml의 안정화된 패턴
# (html_body: file://... + attachments)을 그대로 사용 — 2026-08-04
# 디버그 완료 조합. 상세: concepts/daily-brief-email-workflow-debug.md
#
# 트리거 대상:
#   - wiki/cxl-memory-product-planning-report-*.html  (경영진용 종합 보고서)
#   - wiki/cxl-daily-report-*.html                     (Daily Update HTML)
# 두 패턴 모두 wiki/ 아래 report 계열 HTML로 한정.
#
# ⚠️ 격리 경계 (2026-08-15, wiki/concepts/automation-strategy-and-delivery-boundary.md
# 트랙 B): 이 워크플로는 회사 CXL 업무 전용이며 이 저장소의 트랙 A(경제판단)
# 서사 브랜치 `claude/ai-agent-impl-002tip`와 **완전히 분리**되어야 한다.
# 예전 버전은 `branches: [claude/ai-agent-impl-002tip]`로 트랙 A 브랜치를
# push 트리거로 watch했다 — 트랙 A 작업 중 실수로 이 패턴에 맞는 파일을
# 건드리면 CXL 메일이 발송될 수 있는 결합이었다. 지금은 **이 브랜치 자신의
# 이름**만 watch하므로 트랙 A 브랜치에서 무슨 일이 있어도 이 워크플로는
# 절대 트리거되지 않는다. 이 브랜치를 main이나 claude/ai-agent-impl-002tip에
# 머지하지 말 것 — 격리가 브랜치 분리에 의존한다.
#
# 실행 방법: (1) 이 브랜치에 위 패턴 파일을 push, 또는
#            (2) workflow_dispatch를 ref=이 브랜치명으로 API 호출
#                (회사 LLM이 자체 토큰으로 직접 호출 가능 — 이 세션이
#                대신 호출하지 않는다).

on:
  push:
    branches:
      - fix/cxl-report-sender-checkout-ref
    paths:
      - 'wiki/cxl-memory-product-planning-report-*.html'
      - 'wiki/cxl-daily-report-*.html'
  # 재발송용 수동/API 트리거. workflow_dispatch의 기본 ref는 default
  # branch(main)이므로, 회사 LLM이 API로 호출할 때
  # `ref: refs/heads/fix/cxl-report-sender-checkout-ref`를 명시해야
  # 이 브랜치의 워크플로 정의+콘텐츠로 실행된다.
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch를 ref 지정 없이 호출하면 github.ref=main이 되어
          # (main에는 CXL HTML이 없음) 아래 파일 탐색이 빈손이 된다. 이 브랜치
          # 자신으로 폴백 — 트랙 A 브랜치를 더 이상 참조하지 않는다.
          ref: ${{ github.ref == 'refs/heads/main' && 'refs/heads/fix/cxl-report-sender-checkout-ref' || github.ref }}

      - name: Find latest CXL report
        id: find
        shell: bash
        run: |
          set +e
          # Debug: show what the workspace actually contains after checkout
          echo "DEBUG: pwd=$(pwd)"
          echo "DEBUG: git rev-parse HEAD=$(git rev-parse HEAD)"
          echo "DEBUG: wiki/ listing:"
          ls -la wiki/ 2>&1 | head -30
          echo "DEBUG: glob match for wiki/cxl-daily-report-*.html:"
          ls -1 wiki/cxl-daily-report-*.html 2>&1
          echo "DEBUG: glob match for wiki/cxl-memory-product-planning-report-*.html:"
          ls -1 wiki/cxl-memory-product-planning-report-*.html 2>&1

          # 두 패턴 중 가장 최근 수정된 파일 1개 선택.
          # NOTE: glob inside ls produces no match -> ls exits 2; with `set -e`
          # the command substitution would abort before the `-z` check, so we
          # run this block with `set +e` and test the result explicitly.
          FILES=$(ls -t \
            wiki/cxl-memory-product-planning-report-*.html \
            wiki/cxl-daily-report-*.html \
            2>/dev/null || true)
          FILE=$(echo "$FILES" | head -1)
          echo "DEBUG: FILE resolved to: '$FILE'"
          if [ -z "$FILE" ]; then
            echo "No CXL report HTML found. Exiting."
            exit 1
          fi
          # 제목용 라벨: 파일명에서 종류+날짜 추출
          #   cxl-memory-product-planning-report-2026-08-04-0906.html → "Report 2026-08-04-0906"
          #   cxl-daily-report-2026-08-04-0926.html                     → "Daily 2026-08-04-0926"
          BASE=$(basename "$FILE" .html)
          case "$BASE" in
            cxl-memory-product-planning-report-*) LABEL="Report ${BASE#cxl-memory-product-planning-report-}" ;;
            cxl-daily-report-*)                    LABEL="Daily ${BASE#cxl-daily-report-}" ;;
            *)                                      LABEL="$BASE" ;;
          esac
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Send email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[CXL Report] ${{ steps.find.outputs.label }}"
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: CXL Report Bot
          html_body: file://${{ steps.find.outputs.file }}
          attachments: ${{ steps.find.outputs.file }}
