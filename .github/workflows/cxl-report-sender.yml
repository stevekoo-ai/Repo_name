name: CXL Report Sender

# CXL 상품기획 보고서(경영진용 / Daily Update)가 repo에 push 되면
# 자동으로 Gmail로 발송. daily-brief-report.yml의 안정화된 패턴
# (html_body: file://... + attachments)을 그대로 사용 — 2026-08-04
# 디버그 완료 조합. 상세: concepts/daily-brief-email-workflow-debug.md
#
# 트리거 대상:
#   - wiki/cxl-memory-product-planning-report-*.html  (경영진용 종합 보고서)
#   - wiki/cxl-daily-report-*.html                     (Daily Update HTML)
# 두 패턴 모두 wiki/ 아래 report 계열 HTML로 한정.
#
# 브랜치 (2026-08-10 추가): 서사 브랜치 claude/ai-agent-impl-002tip push 로
# 발송 트리거. upload_cxl_daily.py 가 HTML 을 이 브랜치에 올리므로, branches 를
# 명시해야 트리거가 걸린다 (미지정 시 default branch=main 만 트리거되어 발송
# 안 됨 — 서사 브랜치 HTML 은 main 에 merge 되기 전엔 메일 안 감).

on:
  push:
    branches:
      - claude/ai-agent-impl-002tip
    paths:
      - 'wiki/cxl-memory-product-planning-report-*.html'
      - 'wiki/cxl-daily-report-*.html'
  # Manual trigger: lets us re-send the latest report without a re-push,
  # e.g. after fixing the workflow itself. Checks out the narrative branch
  # by default (workflow_dispatch ref = default branch, so set ref below).
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CXL report HTML lives on the narrative branch, not main. On
          # push events github.ref = claude/ai-agent-impl-002tip (correct).
          # On workflow_dispatch github.ref = main (no HTML there) — fall
          # back to the narrative branch explicitly so manual re-runs find
          # the report. Without this, checkout defaults to main and the
          # "Find latest CXL report" step finds no files, exits 2
          # (2026-08-10 run 31359117007 failure).
          ref: ${{ github.ref == 'refs/heads/main' && 'refs/heads/claude/ai-agent-impl-002tip' || github.ref }}

      - name: Find latest CXL report
        id: find
        shell: bash
        run: |
          # 두 패턴 중 가장 최근 수정된 파일 1개 선택.
          FILE=$(ls -t \
            wiki/cxl-memory-product-planning-report-*.html \
            wiki/cxl-daily-report-*.html \
            2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "No CXL report HTML found. Exiting."
            exit 1
          fi
          # 제목용 라벨: 파일명에서 종류+날짜 추출
          #   cxl-memory-product-planning-report-2026-08-04-0906.html → "Report 2026-08-04-0906"
          #   cxl-daily-report-2026-08-04-0926.html                     → "Daily 2026-08-04-0926"
          BASE=$(basename "$FILE" .html)
          case "$BASE" in
            cxl-memory-product-planning-report-*) LABEL="Report ${BASE#cxl-memory-product-planning-report-}" ;;
            cxl-daily-report-*)                    LABEL="Daily ${BASE#cxl-daily-report-}" ;;
            *)                                      LABEL="$BASE" ;;
          esac
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Send email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[CXL Report] ${{ steps.find.outputs.label }}"
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: CXL Report Bot
          html_body: file://${{ steps.find.outputs.file }}
          attachments: ${{ steps.find.outputs.file }}
