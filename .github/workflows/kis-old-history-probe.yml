name: KIS 옛날 이력 프로브 (임시)

# 2026-08-17 임시 진단용 — 사용자가 "코스피는 왜 2019년 이전 데이터가 없냐,
# 1년 단위로 과거 값을 호출하면 되는 거 아니냐"고 질문 — 2019-01을 backfill
# 시작점으로 고른 건 KIS API의 하드 제약이 아니라 이 저장소가 임의로 고른
# 값이었다(사용자가 애초에 "2019년부터"라고 했었음). 실제로 그보다 더
# 옛날(예: 1995~1999) 구간을 요청했을 때 KIS가 데이터를 주는지 확인한다.
# 확인되면 이 파일은 삭제한다(다른 probe workflow들과 동일 패턴).

on:
  push:
    paths:
      - ".github/workflows/kis-old-history-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: KOSPI 1995~1999 구간 요청
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python3 -c "import datetime; from scripts.investor_flow import kis_fetch_monthly_price_history as f; rows = f('0001', is_index=True, start_date=datetime.date(1995,1,1), end_date=datetime.date(1999,12,31)); print('row count:', len(rows)); print('first 3:', rows[:3]); print('last 3:', rows[-3:])"

      - name: KOSPI 1980~1984 구간 요청 (지수 기준일 1980-01-04 근처)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python3 -c "import datetime; from scripts.investor_flow import kis_fetch_monthly_price_history as f; rows = f('0001', is_index=True, start_date=datetime.date(1980,1,1), end_date=datetime.date(1984,12,31)); print('row count:', len(rows)); print('first 3:', rows[:3]); print('last 3:', rows[-3:])" || echo "::warning::1980년대 구간 실패 — 로그 확인"
