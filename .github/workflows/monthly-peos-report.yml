name: Monthly PEOS Report

# Scheduled cron removed — .github/workflows/daily-peos-report.yml (06:00 KST
# daily) now runs this same pipeline every day, which supersedes the monthly
# cadence entirely. Kept as workflow_dispatch only, for an on-demand rerun of
# a specific month.
on:
  workflow_dispatch:
    inputs:
      month:
        description: "리포트 대상 월 (YYYY-MM). 비워두면 실행 시점의 이번 달."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: monthly-peos-report
  cancel-in-progress: false

jobs:
  run-peos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PEOS pipeline
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            python -m engine.report.run --month "${{ github.event.inputs.month }}"
          else
            python -m engine.report.run
          fi

      - name: Publish latest monthly report to Pages
        # Only when generating the *current* month — an on-demand rerun of a past month
        # (via the month input) must not clobber docs/report.html with stale content.
        if: ${{ github.event.inputs.month == '' }}
        run: |
          LATEST_MONTH_FILE=$(ls report/*.html | grep -vE '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$' | sort | tail -1)
          cp "$LATEST_MONTH_FILE" docs/report.html

      - name: Commit updated report and snapshot
        run: |
          git config user.name "peos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add report/ data/snapshots/ data/normalized/ docs/report.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: monthly PEOS report $(date -u +%Y-%m)"
            git push
          fi
