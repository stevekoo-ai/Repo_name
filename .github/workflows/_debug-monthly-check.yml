name: DEBUG monthly pblanc count (throwaway, not merged to main)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query 청약Home nationwide, last 45 days by announcement date
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 collectors/subscription_monitor/_debug_monthly_check.py
