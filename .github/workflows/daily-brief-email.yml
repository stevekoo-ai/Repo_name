  on:
    push:
      paths:
        - 'report/daily-brief-*.html'

  jobs:
    send-email:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Send daily brief email
          env:
            GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
            GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          uses: dawidd6/action-send-mail@v3
          with:
            server_address: smtp.gmail.com
            server_port: 465
            username: ${{ secrets.GMAIL_ADDRESS }}
            password: ${{ secrets.GMAIL_APP_PASSWORD }}
            subject: "[Daily Brief SKhynix Local LLM] ${{ github.event.head_commit.message }}"
            to: ${{ secrets.GMAIL_ADDRESS }}
            from: Daily Brief Bot
            body_file: report/daily-brief-${{ github.event.head_commit.timestamp | split('T')[0] }}.html
