name: MOLIT 실거래가 API diagnostic

on:
  workflow_dispatch:
    inputs:
      lawd_cd:
        description: "법정동코드 5자리 (기본값: 종로구 11110)"
        required: false
        default: "11110"
      deal_ymd:
        description: "계약년월 6자리 (기본값: 202606)"
        required: false
        default: "202606"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # 2026-08-21 추가 — 수동 실행·즉시 확인용 진단 도구라 가벼운 재시도만
      # (3회, 20초 간격) — 6시간 재시도는 사람을 기다리게 하므로 부적절.
      - name: Hit each MOLIT endpoint directly
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          attempt=1; max_attempts=3
          until python -m scripts.molit_diagnostic "${{ github.event.inputs.lawd_cd }}" "${{ github.event.inputs.deal_ymd }}"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::${max_attempts}회 재시도했지만 실패"
              exit 1
            fi
            echo "[재시도 $attempt/$max_attempts] 실패 — 20초 후 재시도"
            attempt=$((attempt + 1))
            sleep 20
          done
