name: KIS ETF PDF 프로브 (일회성)

# 2026-09-24 — 병목 섹터 ETF의 구성종목·비중을 KIS로 받을 수 있는지 실측하는
# 일회성 조사 도구(scripts/probe_kis_etf_pdf.py). 확인 후 스크립트와 함께 삭제한다.
# 수동 전용 — KIS 토큰 재발급 충돌 이력(wiki/CLAUDE.md 8-3) 때문에 일일 수집
# 시각(07·10·19시 KST)과 겹치지 않을 때만 돌린다.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python3 scripts/probe_kis_etf_pdf.py | tee -a "$GITHUB_STEP_SUMMARY"
