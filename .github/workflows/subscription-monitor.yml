name: Subscription monitor (Seoul/Gyeonggi 국민주택)

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (07/37 past hour) - 5min→30min per user request 2026-08-10. API quota 40,000/day, 48 runs/day plenty of headroom.
  workflow_dispatch:
    inputs:
      test_keyword:
        description: "테스트용: 이 문자열이 단지명/주소에 포함된 기존 공고를 플랫폼시티 매칭인 것처럼 취급해 알림을 발동합니다 (실제 배포에는 비워두세요)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: subscription-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poppler-utils (pdftotext, for income_analysis.py PDF parsing)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install Playwright + Chromium (for income_analysis.py's LH청약플러스 PDF search — only NEW_MATCH pays this cost, but the browser must exist for that case)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fetch listings, check 플랫폼시티 alerts, render page
        id: api
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.GMAIL_ADDRESS }}
          EXTRA_TEST_KEYWORD: ${{ github.event.inputs.test_keyword }}
          NET_API_IDS_PATH: /tmp/api_ids.json
        run: python3 collectors/subscription_monitor/fetch_and_render.py

      # 2026-10-30 — 광교 자연앤 센트레빌 누락(API 미동기화) 재발 방지 그물망.
      # API 단계가 실패해도 반드시 돈다(경로끼리 독립). 청약Home 웹 목록 /
      # GH 게시판 / 뉴스 RSS를 따로 확인하고, 경로가 연속 실패하면 그 자체를 알린다.
      - name: Safety net (청약Home 웹 · GH 게시판 · 뉴스)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.GMAIL_ADDRESS }}
          NET_API_IDS_PATH: /tmp/api_ids.json
        run: python3 collectors/subscription_monitor/net_watch.py

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/subscription-monitor.html collectors/subscription_monitor/alerted_state.json collectors/subscription_monitor/health_state.json collectors/subscription_monitor/income_review_state.json collectors/subscription_monitor/net_state.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: subscription monitor update $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M KST')"
            # 2026-09-19 추가 — 이전엔 재시도 없는 단발 push라, 이 워크플로와
            # 무관한 다른 워크플로(daily-peos-report 등, main에 수십분마다
            # 커밋)가 그사이 먼저 push하면 여기 push가 non-fast-forward로
            # 조용히 실패했다. 실패해도 잡 자체는 안 죽고(마지막 줄에 ||
            # true가 없어 exit code가 그대로 새지만, 스텝 실패가 뒤 스텝을
            # 안 막진 않음) 다음 스텝으로 넘어가 버려서, 이번 run이 갱신한
            # income_review_state.json(15건 카운터)이 그대로 유실 → 다음
            # run이 다시 count=0 기준으로 시작해 같은 매물을 계속 재검토하고
            # 재발송하는 무한 중복 메일의 진짜 원인이었다(사용자 신고
            # "같은 분양건의 검토 메일이 계속 오지?"). real-estate-sync.yml
            # 등 기존 워크플로에 이미 있는 rebase-재시도 루프를 그대로 이식.
            for i in 1 2 3 4 5; do
              git push origin HEAD:main && break
              echo "push rejected, rebasing onto latest (attempt $i)"
              git fetch origin main
              git rebase --autostash origin/main
              sleep $((i * 3))
            done
          fi

      # 그물망·커밋이 모두 끝난 뒤에만 실패로 표시 — 상태 파일 저장을 막지 않으면서
      # 보고서 워치독(report-watchdog.yml)이 API 단계 실패를 볼 수 있게 한다.
      - name: Fail the run if the API step failed
        if: steps.api.outcome == 'failure'
        run: |
          echo "API 단계 실패 — 그물망과 상태 커밋은 이미 완료됨."
          exit 1
