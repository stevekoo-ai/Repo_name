name: 부동산 실거래가 자동 수집 (매매·전세·월세·빌라·오피스텔)

on:
  schedule:
    # MOLIT 데이터는 보통 당월 또는 이전월 기준이므로 매일 수집
    # 03:00 KST = 18:00 UTC 전날 (한국 기준 오전 3시, 주말 포함)
    - cron: "0 18 * * *"  # 매일 03:00 KST
  workflow_dispatch:
    inputs:
      only_apartment:
        description: "true면 아파트 매매만 수집(빠른 테스트용)"
        type: boolean
        default: false
      backfill_rent_months:
        description: "[선택] 전월세 장기 백필 개월수 (예: 120=10년). backfill_rent_regions와 함께 사용, 비우면 평소대로"
        required: false
        default: ""
      backfill_rent_regions:
        description: "[선택] 백필할 법정동코드, 쉼표구분 (예: 41463,41465=기흥구,수지구). 비우면 highlight+residence 기본값"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: real-estate-sync
  cancel-in-progress: true

jobs:
  sync-real-estate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 2026-08-21 추가 — 4개 수집기 각각 실패하면 성공할 때까지(최대
      # 6시간, 10분 간격) 재시도. 기존 설계(하나 실패해도 나머지는 계속
      # 진행)는 그대로 유지 — 6시간 다 소진해도 실패하면 그 항목만
      # /tmp/real_estate_failures.txt에 기록하고 다음 수집기로 넘어감.
      # 잡 자체를 실패시키지 않되, 맨 아래 최종 알림 스텝에서 그 기록을
      # 읽어 실패한 항목만 콕 집어 이메일로 알림.
      - name: 아파트 매매 실거래가 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          attempt=1; max_attempts=36; failed=0
          # 2026-09-24 수정 — fetch_and_store()는 API 전체 접속 불가여도 예외를
          # 던지지 않고 {'status': 'source_error', ...} 딕셔너리를 반환만 한다
          # (collectors/base.retry가 "수집기는 파이프라인을 죽이면 안 된다"는
          # 설계). 그런데 python3 -c는 그 딕셔너리 내용과 무관하게 항상 exit 0로
          # 끝나서, 아래 until 루프가 첫 시도를 "성공"으로 착각해 6시간 재시도가
          # 단 한 번도 실행되지 않았다(2026-09-24 03:14 UTC data.go.kr 전면
          # 다운 상황에서 실측 확인 — 4개 수집기 전부 이 경로로 조용히
          # 0건 수집됐는데 재시도도, 실패 알림도 없었다). status가
          # source_error면 명시적으로 exit 1 해서 루프가 실제로 돌게 한다.
          until python3 -c "
          import sys
          from collectors import molit
          result = molit.fetch_and_store()
          print(f'✓ 아파트 매매: {result}')
          sys.exit(1 if result.get('status') == 'source_error' else 0)
          "; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::warning::아파트 매매 수집 6시간 재시도 소진 — 실패로 넘어감"
              echo "아파트 매매" >> /tmp/real_estate_failures.txt
              failed=1
              break
            fi
            echo "[재시도 $attempt/$max_attempts] 아파트 매매 수집 실패 — 10분 후 재시도"
            attempt=$((attempt + 1))
            sleep 600
          done
          python3 scripts/log_automation_run.py real-estate-sync apartment_sale "$attempt" "$max_attempts" $([ "$failed" -eq 1 ] && echo exhausted || echo success)

      - name: 아파트 전월세(전세/월세) 실거래가 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        if: ${{ github.event.inputs.only_apartment != 'true' }}
        run: |
          attempt=1; max_attempts=36; failed=0
          # 2026-09-24 수정 — 아파트 매매 스텝과 동일한 이유(source_error가
          # exit 0로 위장돼 재시도가 죽어 있던 버그). 상세 주석은 위 스텝 참고.
          until python3 -c "
          import sys
          from collectors import molit_rent
          result = molit_rent.fetch_and_store()
          print(f'✓ 아파트 전월세: {result}')
          sys.exit(1 if result.get('status') == 'source_error' else 0)
          "; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::warning::아파트 전월세 수집 6시간 재시도 소진 — 실패로 넘어감"
              echo "아파트 전월세" >> /tmp/real_estate_failures.txt
              failed=1
              break
            fi
            echo "[재시도 $attempt/$max_attempts] 아파트 전월세 수집 실패 — 10분 후 재시도"
            attempt=$((attempt + 1))
            sleep 600
          done
          python3 scripts/log_automation_run.py real-estate-sync apartment_rent "$attempt" "$max_attempts" $([ "$failed" -eq 1 ] && echo exhausted || echo success)

      # 2026-09-24 추가 — 전월세 장기 백필(일회성, backfill_rent_months 지정 시에만).
      #
      # 왜 필요했나: 새로 추가한 지역(RESIDENCE_REGION 등)은 평소 fetch_and_store()가
      # "티어 series가 이미 두꺼우면 최근 1개월만"이라 항상 1개월치만 받는다 —
      # 사용자 질문("왜 한 달치만 가져와?")이 정확히 이 게이트 때문이었다.
      #
      # 55개 지역 전체를 10년치(120개월)로 백필하면 6,600회 호출이 돼 data.go.kr
      # 일일 호출 한도를 넘길 위험이 크다 — 그래서 **지역을 좁혀서만** 백필한다.
      # 기본값(비워두면)은 highlight+residence(기흥구+수지구) 딱 2곳 — 실제
      # 개인 의사결정에 쓰이는 지역만. 티어(수도권 등) 집계는 이 백필에서 아예
      # 건너뛴다(molit_rent.fetch_and_store docstring 참고 — 일부 지역만 조회해서
      # 티어를 갱신하면 그 달의 티어값이 조용히 오염된다).
      - name: 전월세 장기 백필 (backfill_rent_months 지정 시에만)
        if: ${{ github.event.inputs.backfill_rent_months != '' }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          BACKFILL_MONTHS: ${{ github.event.inputs.backfill_rent_months }}
          BACKFILL_REGIONS: ${{ github.event.inputs.backfill_rent_regions }}
        run: |
          # 2026-09-24 추가 — 원래 재시도가 아예 없어서, 2026-09-24 첫 실행이
          # data.go.kr 전면 다운(ConnectTimeoutError, 모든 지역·월 프로브 실패)
          # 시점과 겹쳤을 때 결과가 'status': 'source_error'로 조용히 끝났고
          # 10년치 중 단 1개월도 못 받았다(사용자 질문 "왜 10년치가 안 돼?"의
          # 실제 원인 — 백필 로직 버그가 아니라 그 순간 API가 죽어 있었던 것).
          # 수동 일회성 백필이라 다른 4개 수집기처럼 6시간까지는 안 갔고,
          # 최대 1시간(6회×10분)만 재시도 — 그래도 안 되면 실패 알림에 포함.
          attempt=1; max_attempts=6; failed=0
          until python3 -c "
          import os, sys
          from collectors import molit_rent
          months = int(os.environ['BACKFILL_MONTHS'])
          raw_regions = os.environ.get('BACKFILL_REGIONS', '').strip()
          regions = [r.strip() for r in raw_regions.split(',') if r.strip()] if raw_regions else [
              molit_rent.HIGHLIGHT_REGION['code'], molit_rent.RESIDENCE_REGION['code']]
          result = molit_rent.fetch_and_store(months=months, region_codes=regions)
          print(f'✓ 전월세 장기 백필({regions}, {months}개월): {result}')
          sys.exit(1 if result.get('status') == 'source_error' else 0)
          "; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::warning::전월세 장기 백필 1시간 재시도 소진 — 실패로 넘어감"
              echo "전월세 장기 백필" >> /tmp/real_estate_failures.txt
              failed=1
              break
            fi
            echo "[재시도 $attempt/$max_attempts] 전월세 장기 백필 실패 — 10분 후 재시도"
            attempt=$((attempt + 1))
            sleep 600
          done

      - name: 연립다세대(빌라) 매매 실거래가 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        if: ${{ github.event.inputs.only_apartment != 'true' }}
        run: |
          attempt=1; max_attempts=36; failed=0
          # 2026-09-24 수정 — 아파트 매매 스텝과 동일한 이유. 상세 주석은 위 참고.
          until python3 -c "
          import sys
          from collectors import molit_villa
          result = molit_villa.fetch_and_store()
          print(f'✓ 빌라 매매: {result}')
          sys.exit(1 if result.get('status') == 'source_error' else 0)
          "; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::warning::빌라 매매 수집 6시간 재시도 소진 — 실패로 넘어감"
              echo "빌라 매매" >> /tmp/real_estate_failures.txt
              failed=1
              break
            fi
            echo "[재시도 $attempt/$max_attempts] 빌라 매매 수집 실패 — 10분 후 재시도"
            attempt=$((attempt + 1))
            sleep 600
          done
          python3 scripts/log_automation_run.py real-estate-sync villa_sale "$attempt" "$max_attempts" $([ "$failed" -eq 1 ] && echo exhausted || echo success)

      - name: 오피스텔 매매 실거래가 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        if: ${{ github.event.inputs.only_apartment != 'true' }}
        run: |
          attempt=1; max_attempts=36; failed=0
          # 2026-09-24 수정 — 아파트 매매 스텝과 동일한 이유. 상세 주석은 위 참고.
          until python3 -c "
          import sys
          from collectors import molit_officetel
          result = molit_officetel.fetch_and_store()
          print(f'✓ 오피스텔 매매: {result}')
          sys.exit(1 if result.get('status') == 'source_error' else 0)
          "; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::warning::오피스텔 매매 수집 6시간 재시도 소진 — 실패로 넘어감"
              echo "오피스텔 매매" >> /tmp/real_estate_failures.txt
              failed=1
              break
            fi
            echo "[재시도 $attempt/$max_attempts] 오피스텔 매매 수집 실패 — 10분 후 재시도"
            attempt=$((attempt + 1))
            sleep 600
          done
          python3 scripts/log_automation_run.py real-estate-sync officetel_sale "$attempt" "$max_attempts" $([ "$failed" -eq 1 ] && echo exhausted || echo success)

      - name: 수집된 데이터 검증
        run: |
          echo "=== 저장된 파일 확인 ==="
          ls -lah data/normalized/molit_* 2>/dev/null | head -20 || echo "정규화 데이터 없음"
          echo ""
          echo "=== CSV 파일 확인 ==="
          ls -lah sources/molit*.csv 2>/dev/null | head -20 || echo "CSV 파일 없음"

      # 2026-09-03 추가 — 사용자 요청 "HTML보고서에 부동산 매매가 전월세에 대해서
      # 쌓인 데이터만큼 daily 그래프로 보여줘 트렌드가 보고싶다". 위에서 갱신한
      # data/normalized/molit_*.csv를 그대로 읽어 docs/real-estate-daily.html을
      # 매번 다시 그린다(engine/report/daily_dashboard.py와 동일 패턴).
      - name: 부동산 Daily Dashboard 재생성
        run: python -m engine.report.real_estate_dashboard

      - name: 리포트 인덱스 갱신 (신규 대시보드 링크 반영)
        run: python3 scripts/build_reports_index.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "real-estate-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          # 2026-09-07: 예전엔 두 경로를 한 줄에 넣었는데(`git add A B`),
          # sources/molit*.csv가 존재하지 않아 git add 전체가
          # "pathspec did not match"로 실패했고 || true가 그걸 감췄다.
          # 그 결과 정규화 데이터가 스테이징되지 않은 채 남아, 아래 rebase가
          # "cannot rebase: You have unstaged changes"로 죽었다. 수집이 실제로
          # 데이터를 만들어낼 때만 터지는 잠복 버그라 그동안 안 보였다.
          # 경로마다 따로 add해서 하나가 비어도 나머지는 스테이징되게 한다.
          git add data/normalized/molit* 2>/dev/null || true
          git add sources/molit*.csv 2>/dev/null || true
          git add docs/real-estate-daily.html docs/reports-index.html
          [ -f sources/automation-run-log.csv ] && git add sources/automation-run-log.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: real estate data auto-sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected, rebasing onto latest (attempt $i)"
              git fetch origin main
              # --autostash: 커밋 대상이 아닌 잔여 변경(캐시 등)이 남아 있어도
              # rebase가 죽지 않게 한다. 위 add 수정과 별개의 안전장치.
              git rebase --autostash origin/main
              sleep $((i * 3))
            done
          fi

      # 2026-08-21 추가 — 잡 자체는 실패하지 않는 설계(하나 실패해도 나머지
      # 진행)라 failure()가 아니라 always()로 검사 — 6시간 재시도를 다
      # 소진한 항목이 하나라도 있으면(위 4개 수집기 스텝에서 기록) 알림.
      - name: 실패 시 알림 (조용한 실패 방지)
        if: always()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          if [ -f /tmp/real_estate_failures.txt ]; then
            failed=$(paste -sd', ' /tmp/real_estate_failures.txt)
            python3 -m scripts.send_report_email \
              --failure-alert "real-estate-sync 워크플로 일부 항목이 실패했습니다 (6시간 재시도 소진): ${failed} — 오늘 이 항목들의 실거래가 데이터는 갱신되지 않았습니다."
          fi
