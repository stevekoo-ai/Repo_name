name: KOSIS Table Lookup

on:
  workflow_dispatch:
    inputs:
      series:
        description: "확인할 지표 key (비워두면 4개 전부): cpi_index / industrial_production_index / retail_sales_index / unemployment_rate"
        required: false
        default: ""
      search:
        description: "통합검색 키워드 (입력하면 series 대신 이걸로 KOSIS 통계표를 검색). 예: 소비자물가지수"
        required: false
        default: ""

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # 2026-09-07: requests만 깔다가 ModuleNotFoundError로 죽고 있었다.
        # 이 스크립트들은 collectors.base를 import하고, base는 pandas를,
        # core.config는 pyyaml을 쓴다 — 진단 도구가 조용히 못 돌고 있었던 셈.
        run: pip install requests pandas pyyaml

      # 2026-08-21 추가 — 수동 실행·즉시 확인용 진단 도구라 가벼운 재시도만
      # (3회, 20초 간격) — 6시간 재시도는 사람을 기다리게 하므로 부적절.
      # 2026-09-07: 검색 키워드는 ${{ }}로 셸에 직접 보간하지 않고 env로 넘긴다 —
      # 한글/공백이 들어가고, 보간은 임의 셸 코드가 될 수 있는 형태라서.
      - name: Look up KOSIS candidate tables
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          SEARCH_KEYWORD: ${{ github.event.inputs.search }}
        run: |
          if [ -n "$SEARCH_KEYWORD" ]; then
            python -u -m scripts.kosis_lookup --search "$SEARCH_KEYWORD"
            exit $?
          fi
          attempt=1; max_attempts=3
          until python -u -m scripts.kosis_lookup ${{ github.event.inputs.series }}; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::${max_attempts}회 재시도했지만 실패"
              exit 1
            fi
            echo "[재시도 $attempt/$max_attempts] 실패 — 20초 후 재시도"
            attempt=$((attempt + 1))
            sleep 20
          done
