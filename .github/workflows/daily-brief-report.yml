name: Daily Brief Report Sender

on:
  push:
    paths:
      - 'report/daily-brief-*.html'

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest daily brief
        id: find
        shell: bash
        run: |
          FILE=$(ls -t report/daily-brief-*.html 2>/dev/null | head -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Send email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[Daily Brief] ${{ github.event.head_commit.message }}"
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: Daily Brief Bot
          html_body: ${{ steps.find.outputs.file }}
