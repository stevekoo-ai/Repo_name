  name: Daily Brief Report Sender

  on:
    push:
      paths:
        - 'report/daily-brief-*.html'

  jobs:
    send-email:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Get date from latest daily brief
          id: getdate
          run: |
            date=$(ls -t report/daily-brief-*.html | head -1 | sed 's/.*daily-brief-//;s/\.html//')
            echo "date=$date" >> "$GITHUB_OUTPUT"

        - name: Send daily brief email
          env:
            GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
            GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          uses: dawidd6/action-send-mail@v3
          with:
            server_address: smtp.gmail.com
            server_port: 465
            username: ${{ secrets.GMAIL_ADDRESS }}
            password: ${{ secrets.GMAIL_APP_PASSWORD }}
            subject: "[Daily Brief] ${{ github.event.head_commit.message }}"
            to: ${{ secrets.GMAIL_ADDRESS }}
            from: Daily Brief Bot
            body_file: report/daily-brief-${{ steps.getdate.outputs.date }}.html
